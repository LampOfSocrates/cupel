  # ----------------------------------------------------------- conversations
  /agenttrees/{tree}/conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      x-requires: view
      summary: Conversations (paginated, searchable, fork-filterable)
      description: |
        feature-spec.md:121: "GET /agenttrees/{tree}/conversations (paginated,
        ?search=, ?forks_of={id}, sorted by last activity; incl. turns; lineage
        on forks)" — quoted as written; "incl. turns" no longer holds. A
        conversation row is metadata plus `turn_count`; the transcript is its
        own paged collection at
        GET /agenttrees/{tree}/conversations/{id}/turns. A listing that
        inlined every turn of every row made the sidebar's cost the product of
        page size and conversation length.

        Default listing returns ROOT conversations only (lineage null) so the
        sidebar can nest forks under their parent without duplicates
        (feature-spec.md:5 "Forked conversations nest under their parent");
        pass forks_of to list a conversation's forks.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - name: search
          in: query
          description: |
            Free-text filter. Defined precisely because an undefined one makes
            two conformant backends disagree and gives `cupel-ready` nothing
            to check.

            SUBSTRING, not tokens. The WHOLE parameter is one substring: it is
            not split on whitespace and the words are not reordered, so
            `refund policy` matches "…refund policy…" and does NOT match
            "policy for refunds". A partial word matches — `fund pol` finds
            "Refund policy".

            CASE-INSENSITIVE, and not only for ASCII: `ÜBER` matches `über`.

            LITERAL. The value is matched exactly as sent; there is no query
            syntax and there are no wildcards. `%`, `_`, `*` and quotes match
            themselves — a backend implementing this over SQL `LIKE` MUST
            escape them, or a caller searching for `50%` gets the whole
            collection back.

            FIELDS: the conversation's `title`, and the `content` of any turn
            in it, either role — the sidebar's search is how a user finds "the
            conversation where I asked about parcels", and titles alone cannot
            answer that. The result is the CONVERSATION, never the turn, and
            no snippet or highlight is returned; a caller that wants the
            matching turn fetches …/turns.

            COMPOSITION: it ANDs with every other parameter, and it narrows
            BEFORE paging — `total` is the number of matches, not the size of
            the collection. Because the default listing is roots-only, a match
            that occurs inside a FORK surfaces only under `?forks_of=`.
            Tombstones are excluded here as everywhere.

            Leading and trailing whitespace is trimmed, and a value that is
            empty or all whitespace is treated as if the parameter were
            absent — never as a filter matching nothing.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: forks_of
          in: query
          description: Only forks of this conversation id (feature-spec.md:73).
          schema: { type: string }
        - name: agent_id
          in: query
          description: >-
            Only conversations that used this agent — node ⋯ "view recent
            conversations for this agent" (feature-spec.md:26) and the
            Test-as-evaluation prefilter (feature-spec.md:87).
          schema: { type: string }
        - name: origin
          in: query
          description: >-
            Filter by conversation origin so machine-originated traffic
            (generator drip, production pipelines) doesn't flood the
            interactive sidebar list.
          schema: { type: string, enum: [interactive, machine] }
      responses:
        "200":
          description: >-
            Page of conversations, most recent activity first. Tombstones are
            never included and there is deliberately no include_deleted
            parameter: nothing in this contract can act on a list of deleted
            conversations — there is no restore and no purge — and every
            caller that must reach one arrives by following a reference (a
            fork's lineage, an eval-benchmark item's source, a judgment's subject),
            which is a read BY ID. A filter whose results support no action
            would be surface pretending to be a feature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agenttrees/{tree}/conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      x-requires: view
      summary: One conversation (metadata; turns are a separate collection)
      description: |
        Single-resource fetch backing "Open in Chat: any fork can be opened in
        the main Chat page and continued there like any conversation"
        (feature-spec.md:70), "open parent (if fork)" (feature-spec.md:6), the
        queue panel's Open-in-Chat link, and deep links from search results —
        none of which can rely on re-paging the list. Lineage present iff fork.

        This returns the conversation, NOT its transcript: a conversation has
        no length limit, so a resource that inlined every turn had an unbounded
        response body and no way for a caller to ask for less. Fetch the
        transcript from …/turns, which is paged; `turn_count` here is how a
        caller sizes that fetch without making it.

        A DELETED conversation still answers 200 here, with `deleted: true` —
        it is a tombstone, not an absence, and 404 would make the two
        indistinguishable to the one caller who most needs to tell them apart:
        a fork resolving its parent, which must render "parent deleted" rather
        than a broken link. 404 keeps its own meaning — no such conversation,
        or not in this tree.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - { $ref: "#/components/parameters/conversationId" }
      responses:
        "200":
          description: The conversation (metadata only); `deleted` says whether it is a tombstone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [conversations]
      operationId: updateConversation
      x-requires: view
      summary: Rename a conversation
      description: |
        feature-spec.md:121 "PATCH/DELETE /agenttrees/{tree}/conversations/{id}";
        action source: sidebar ⋯ menu "rename, delete" (feature-spec.md:6).
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - { $ref: "#/components/parameters/conversationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "200":
          description: Updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [conversations]
      operationId: deleteConversation
      x-requires: view
      summary: Delete a conversation (soft — history invariants survive)
      description: |
        Delete is a tombstone: the conversation disappears from listings and
        chat, but judgments referencing its turns are "persisted forever, never
        overwritten" (feature-spec.md:59; invariant), eval
        cases keep their source refs, and forks keep their lineage (the parent
        link renders as deleted). No cascade to judgments, cases, or forks.

        The tombstone is VISIBLE, not implied: `Conversation.deleted` reads
        true afterwards, GET on this id keeps answering 200, its /turns keep
        answering, and every write against it answers 409
        conversation_deleted. IDEMPOTENT — deleting a tombstone is a no-op
        and answers 204 again, because the operation's promise ("this
        conversation is deleted") is already kept.

        There is NO restore. Undelete is not one endpoint: it is a place to
        find the tombstone, a decision about what happens to its forks, and a
        story for a conversation restored into a tree that has since been
        disabled — real UX, and that design is not done. Making the tombstone visible is
        what a restore would need first, and that is what this operation now
        provides.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - { $ref: "#/components/parameters/conversationId" }
      responses:
        "204": { description: "Deleted, or already deleted — the operation is idempotent." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /agenttrees/{tree}/conversations/{conversationId}/turns:
    get:
      tags: [conversations]
      operationId: listTurns
      x-requires: view
      summary: A conversation's transcript, paged
      description: |
        The transcript, separated from the conversation resource so that
        opening a long one costs a bounded response instead of every turn ever
        written into it. Turns carry envelopes (feature-spec.md:81 "envelope on
        turn objects").

        ORDER IS CHRONOLOGICAL, oldest first — the domain order of a
        transcript, and the one that makes offset paging STABLE here: a
        conversation only ever grows at the tail, so page 1 names the same
        turns forever no matter how much is appended while a reader is looking
        at it. This is the exception to the drift warning in the Collections
        rule, and it is deliberate.

        `page` DEFAULTS TO THE LAST PAGE, not the first. A reader opens a
        transcript at its end; defaulting to page 1 would land them at the
        top of a long history and cost a second request to reach the part
        they came for. The response's own `page` says which page that was, and
        `total` says how much is earlier — page-1-onwards is "load earlier".

        `turn_ids` is the escape hatch from paging for callers that already
        know which turns they want (an eval benchmark's reference items, a fork's
        lineage turn): with it the page is those turns, in the same
        chronological order, and paging applies to that subset.

        A DELETED conversation's transcript still reads here. That is the
        point of a soft delete: an eval-benchmark reference item, an eval case's
        source and a judgment's subject all name a turn, and every one of them
        would become a dangling pointer if the tombstone stopped answering.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - { $ref: "#/components/parameters/conversationId" }
        - name: turn_ids
          in: query
          description: >-
            Comma-separated turn ids; unknown ids are ignored rather than
            404ing, so a stale reference degrades to a missing row.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: page
          in: query
          description: Omit for the LAST page — the tail of the transcript.
          schema: { type: integer, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Page of turns, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ------------------------------------------------------------------ memory
  /agenttrees/{tree}/memory:
    get:
      tags: [memory]
      operationId: getMemory
      x-requires: view
      summary: The tree's memory document
      description: |
        feature-spec.md:114: "Memory: GET/PUT/DELETE /agenttrees/{tree}/memory".
        It is how you "See and control what the app remembers about
        your conversations per agent tree — view, edit, or clear the memory
        document; compaction runs as a visible queued task — using the
        Memory panel." One document per tree. A tree that has never
        remembered anything returns content "" (not 404).
      parameters: [{ $ref: "#/components/parameters/tree" }]
      responses:
        "200":
          description: The memory document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [memory]
      operationId: putMemory
      x-requires: tune
      summary: Edit the memory document (overwrites — mutable by design)
      description: |
        The edit half of "view, edit, or clear". Memory
        is a MUTABLE working document — the deliberate exception to the
        append-only stores (versions/judgments/snapshots):
        PUT replaces the content outright.
      parameters: [{ $ref: "#/components/parameters/tree" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryUpdate" }
      responses:
        "200":
          description: The updated document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [memory]
      operationId: clearMemory
      x-requires: tune
      summary: Clear the memory document
      description: |
        The clear half of "view, edit, or clear the
        memory document". Resets content to ""; subsequent GET returns the
        empty document, not 404. Conversations are untouched — only the
        distilled memory is cleared.
      parameters: [{ $ref: "#/components/parameters/tree" }]
      responses:
        "204": { description: Cleared. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agenttrees/{tree}/memory/compact:
    post:
      tags: [memory]
      operationId: compactMemory
      x-requires: tune
      summary: Compact conversations into memory (queued task)
      description: |
        feature-spec.md:114: "POST /agenttrees/{tree}/memory/compact
        (queued)". Enqueued like all backend work (feature-spec.md:102
        "every request returns task_id"): 202 + TaskRef; the task has type
        "compact" and streams progress on GET /tasks/stream. On completion
        the memory document holds the merged summary —
        "LLM summarization merges what matters into the tree's memory
        document". Compaction rewrites memory, not conversations —
        transcripts, traces and judgments are untouched.
      parameters: [{ $ref: "#/components/parameters/tree" }]
      responses:
        "202":
          description: Compaction enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRef" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------------- chat
  /agenttrees/{tree}/chat:
    post:
      tags: [chat]
      operationId: chat
      x-requires: view
      summary: Send a message (SSE stream or single JSON, flag in body)
      description: |
        feature-spec.md:119: "POST /agenttrees/{tree}/chat (SSE; queued →
        returns task_id), stop = DELETE /tasks/{task_id}".

        Both modes on this one endpoint: "stream: true (SSE
        token stream, the UI default) and stream: false (single JSON response,
        for curl/scripts/backends that can't stream) — same endpoint, flag in
        the request body".

        stream=true → 200 text/event-stream with events:
          - event: task   — data: ChatTaskEvent (first event; carries the
            task_id used for stop = DELETE /tasks/{task_id}, plus conversation
            and turn ids)
          - event: token  — data: TokenEvent (one per streamed token/delta)
          - event: done   — data: ChatDoneEvent (terminal event, always sent:
            status completed = the finished assistant Turn; status cancelled =
            stop-generation fired mid-stream and the turn carries the partial
            content generated so far, which IS persisted. Envelope included —
            captured at generation, feature-spec.md:76)
          - event: error  — data: Error
        Trace spans do NOT stream here; they stream on GET /tasks/stream ("same
        SSE channel as tasks", feature-spec.md:146).

        stream=false → 200 application/json (ChatResponse) once generation
        completes; still carries task_id for symmetry. Stop-generation is a
        stream-mode affordance only: with stream=false the task_id arrives
        after completion, too late to cancel (feature-spec.md:13 scopes stop
        to "while streaming").

        Session-scoped chat settings (model, temperature, system prompt) are
        "sent with each /chat call" (feature-spec.md:274). Omitting
        conversation_id starts a new conversation.

        Machine callers (generator, pipelines): set origin:machine on the
        first call of a conversation, author to a stable machine identity, and
        client_message_id to make retries idempotent — the server returns the
        original result instead of appending a duplicate turn. The server
        stamps the inbound turn's envelope at receipt.
      parameters: [{ $ref: "#/components/parameters/tree" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: >
            SSE stream (stream=true) or completed turn as JSON (stream=false).
          content:
            text/event-stream:
              x-sse-events:
                task: "#/components/schemas/ChatTaskEvent"
                token: "#/components/schemas/TokenEvent"
                done: "#/components/schemas/ChatDoneEvent"
                error: "#/components/schemas/Error"
              schema:
                description: One SSE frame's data payload, keyed by event name (see x-sse-events).
                oneOf:
                  - { $ref: "#/components/schemas/ChatTaskEvent" }
                  - { $ref: "#/components/schemas/TokenEvent" }
                  - { $ref: "#/components/schemas/ChatDoneEvent" }
                  - { $ref: "#/components/schemas/Error" }
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /upload:
    post:
      tags: [chat]
      operationId: upload
      x-requires: none
      summary: Upload an attachment before send
      description: |
        feature-spec.md:119 "POST /upload"; composer flow (feature-spec.md:273,
        dev prompt #4): "multipart upload to /upload before send".
        Global (not tree-scoped) per the API section grouping.

        Type/size limits: /settings is deferred (Phase 2), so in Phase 1 the
        limits live in the single config artifact and the server enforces them
        — oversize/wrong-type uploads get 413/415-style errors and the UI
        surfaces the message. No client-side pre-validation source exists yet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored attachment; reference its id in ChatRequest.attachments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /feedback:
    post:
      tags: [chat]
      operationId: postFeedback
      x-requires: none
      summary: 👍/👎 on an assistant message
      description: |
        feature-spec.md:119: "POST /feedback (writes a scorer: human judgment —
        single store with /eval/judgments)". Body per dev prompt #3
        (feature-spec.md:272): "POST {message_id, rating} to
        /feedback". Thumbs "also persist as lightweight judgments, scorer: human"
        (feature-spec.md:60). Judgments are append-only.

        message_id = Turn.id. The returned judgment has subject
        {kind: turn, id: message_id} and scorer {kind: human} with ref,
        version and model null — a thumb runs no rubric and no model. Read it
        back via GET /eval/judgments?subject_kind=turn&subject_id= (or
        ?conversation_id= for a whole conversation's worth) to re-render 👍/👎
        state on conversation reload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "201":
          description: The appended human judgment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Judgment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ------------------------------------------------------------- evaluations
  /agenttrees/{tree}/replay:
    post:
      tags: [replay]
      operationId: replay
      x-requires: evaluate
      summary: Replay selected conversations/turns under a changed config
      description: |
        feature-spec.md:122: "POST /agenttrees/{tree}/replay". Engine
        (feature-spec.md:41): "take stored conversations or individual turns,
        re-execute them under a changed config, optionally judge them, queue the
        work, compare outputs." Enqueued: "All backend work enqueued; every
        request returns task_id" (feature-spec.md:102); batch = parent task +
        child per unit (feature-spec.md:103).

        Phase 1 context rule: replays always run frozen — "replay under each
        turn's original envelope" (feature-spec.md:77). context_policy is in
        the schema pinned to enum [frozen] (default frozen) so the invariant
        is machine-checkable; Phase 2 widens the enum and adds
        context_override / tools_mode (feature-spec.md:82) backward-compatibly.

        The grid is "baseline column + one column per run config, row per
        turn" (feature-spec.md:49): configs[] yields one column each, after
        the baseline column (the original stored outputs, or baseline_evaluation_id's
        outputs when re-comparing).
      parameters: [{ $ref: "#/components/parameters/tree" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayRequest" }
      responses:
        "202":
          description: Work enqueued; the evaluation row appears immediately and fills incrementally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayAccepted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /agenttrees/{tree}/replay/turn:
    post:
      tags: [replay]
      operationId: replayTurn
      x-requires: evaluate
      summary: Re-fire one turn against one or many endpoints (forks)
      description: |
        feature-spec.md:122: "POST /agenttrees/{tree}/replay/turn (endpoints[] →
        task + conversation per endpoint)". Semantics (feature-spec.md:68):
        "Each (turn × endpoint × config) forks a new conversation: original
        history up to that turn is copied, the turn is re-generated by the
        chosen endpoint, and the result is stored as a normal conversation."
        Return shape (feature-spec.md:71): "returns one task_id + new
        conversation_id per endpoint." Forks carry lineage metadata
        (feature-spec.md:69). Also returns evaluation_id: a turn re-fire is an evaluation
        whose grid pivots to "compare forks of the same turn across endpoints
        (column per endpoint)" (feature-spec.md:73) — fetch it via
        GET …/evaluations/{evaluationId}. Replays run frozen (context_policy as on /replay).
      parameters: [{ $ref: "#/components/parameters/tree" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayTurnRequest" }
      responses:
        "202":
          description: One entry per requested endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayTurnAccepted" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /agenttrees/{tree}/evaluations:
    get:
      tags: [replay]
      operationId: listEvaluations
      x-requires: view
      summary: List evaluations
      description: |
        feature-spec.md:122 "GET /agenttrees/{tree}/runs". Paged: a tree
        accumulates evaluations forever and nothing ever removes one.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Page of evaluations, newest first (cells omitted; fetch one for the grid).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationSummaryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /agenttrees/{tree}/evaluations/{evaluationId}:
    get:
      tags: [replay]
      operationId: getEvaluation
      x-requires: view
      summary: Evaluation detail — one page of the comparison grid
      description: |
        feature-spec.md:122 "GET /agenttrees/{tree}/runs/{id}". Grid shape
        (feature-spec.md:49): "baseline column + one column per run config, row
        per turn." Cells fill incrementally as child tasks finish
        (feature-spec.md:108); live fill arrives via GET /tasks/stream.

        ROWS ARE PAGED (`rows` is an EvaluationRowPage) because the body is a
        product: rows × columns × cells, and a replay of fifty conversations
        against four configs is a large response that a client POLLS while it
        fills. Paging here is stable in a way a newest-first listing is not —
        an evaluation's rows are ALL created when the evaluation is created,
        and only its CELLS change afterwards — so a page number means the same
        rows for the life of the evaluation, including while it is running.
        Columns are not paged: they are the configs the caller chose, so the
        set is small, caller-authored and needed whole to read any row.

        CONDITIONAL: the response carries an `ETag` over this page's content
        (status, columns, and the cells of the rows returned). Send it back as
        `If-None-Match` and an unchanged grid answers 304 with no body, which
        is what makes polling a filling evaluation cheap. The tag covers ONE
        page of one evaluation — the URL, query included, is part of its
        identity, as HTTP requires.
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - name: evaluationId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: Grid ROWS per page; every column of a returned row comes with it.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: If-None-Match
          in: header
          description: An ETag from a previous read of this page; matches answer 304.
          schema: { type: string }
      responses:
        "200":
          description: The evaluation, with one page of rows and every column.
          headers:
            ETag:
              description: Opaque validator for this page; replay it as If-None-Match.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evaluation" }
        "304":
          description: >-
            Not modified — the page is byte-identical to the one the caller's
            ETag names. No body, so a poll over a finished (or idle) grid costs
            a round trip and nothing else.
          headers:
            ETag:
              description: The same validator, so the caller can keep using it.
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ------------------------------------------------------------------- trace
  /agenttrees/{tree}/turns/{turnId}/trace:
    get:
      tags: [trace]
      operationId: getTrace
      x-requires: view
      summary: Span tree for a turn
      description: |
        feature-spec.md:123: "GET /agenttrees/{tree}/turns/{turn_id}/trace".
        Span model (feature-spec.md:140): "Span = {id, parent_id, type:
        agent|llm|tool, name, start, end, tokens_in?, tokens_out?, cost?,
        model?, status, payload_ref}". Header shows turn totals (wall time,
        tokens in/out, cost) (feature-spec.md:143) and the turn's context
        envelope (feature-spec.md:76 "shown in trace header"). Live spans
        stream on GET /tasks/stream (feature-spec.md:146).
      parameters:
        - { $ref: "#/components/parameters/tree" }
        - name: turnId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trace (totals + flat span list with parent links).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "404": { $ref: "#/components/responses/NotFound" }

  /spans/{spanId}/payload:
    get:
      tags: [trace]
      operationId: getSpanPayload
      x-requires: none
      summary: Lazy-loaded span payload
      description: |
        feature-spec.md:123 / :147: "GET /spans/{id}/payload (lazy-loaded
        prompt/response bodies)". Global per feature-spec.md:111 ("Global:
        tasks, span payloads…"). Full prompt/response for LLM spans,
        args/result for tool spans (feature-spec.md:145).
      parameters:
        - name: spanId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payload bodies for the span.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpanPayload" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------- tasks
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      x-requires: none
      summary: List tasks (polling fallback + sidebar badge)
      description: |
        feature-spec.md:131 "GET /tasks"; polling fallback for the SSE stream
        (feature-spec.md:104); sidebar badge counts pending (feature-spec.md:107).
        `limit` is GONE — it was a bare top-N with no way to ask for the rest
        and no way to know there was a rest; `page`/`page_size`/`total` say
        both (Collections rule, info.description).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, done, failed, cancelled]
        - name: parent_id
          in: query
          description: Children of this task; omit for the default top-level listing.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Page of tasks, newest first. Parents only (unless parent_id given); expand via GET /tasks/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tasks/stream:
    get:
      tags: [tasks]
      operationId: streamTasks
      x-requires: none
      summary: SSE — task status/progress + live trace spans
      description: |
        feature-spec.md:131: "GET /tasks/stream (SSE: status + progress)".
        "Live updates via SSE: status changes and progress events push as they
        happen — no refresh" (feature-spec.md:104). Also carries live trace
        spans: "spans appear live while the turn is generating (same SSE channel
        as tasks)" (feature-spec.md:146).

        Events:
          - event: task      — data: Task (status change; includes progress)
          - event: progress  — data: TaskProgressEvent (per-unit ticks, e.g.
            "Conversation 3/10 · turn 2/6", feature-spec.md:105)
          - event: span      — data: SpanEvent (a span for a generating turn)
          - event: judgment  — data: JudgmentEvent ("scores stream into the
            grid live as judging tasks finish (SSE)", feature-spec.md:64;
            summary header updates live)
      responses:
        "200":
          description: SSE stream; one frame per event (see x-sse-events).
          content:
            text/event-stream:
              x-sse-events:
                task: "#/components/schemas/Task"
                progress: "#/components/schemas/TaskProgressEvent"
                span: "#/components/schemas/SpanEvent"
                judgment: "#/components/schemas/JudgmentEvent"
              schema:
                description: One SSE frame's data payload, keyed by event name (see x-sse-events).
                oneOf:
                  - { $ref: "#/components/schemas/Task" }
                  - { $ref: "#/components/schemas/TaskProgressEvent" }
                  - { $ref: "#/components/schemas/SpanEvent" }
                  - { $ref: "#/components/schemas/JudgmentEvent" }

  /tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      x-requires: none
      summary: Task detail including children
      description: |
        feature-spec.md:131 "GET /tasks/{id} (incl. children)". Task model
        (feature-spec.md:103): "{id, type, status, progress: {done, total,
        stage}, parent_id?, error?, created/started/finished_at}".
      parameters: [{ $ref: "#/components/parameters/taskId" }]
      responses:
        "200":
          description: Task with children populated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      operationId: cancelTask
      x-requires: none
      summary: Cancel a task (cascades to children); also stop-generation
      description: |
        feature-spec.md:131 "DELETE /tasks/{id} (cancel, cascades)"; parent
        cancels children (feature-spec.md:106). Doubles as chat
        stop-generation: "stop = DELETE /tasks/{task_id}" (feature-spec.md:119).
      parameters: [{ $ref: "#/components/parameters/taskId" }]
      responses:
        "200":
          description: The task, now cancelled (children cascaded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/retry-failed:
    post:
      tags: [tasks]
      operationId: retryFailed
      x-requires: none
      summary: Retry only the failed children of a batch
      description: |
        feature-spec.md:131 "POST /tasks/{id}/retry-failed". "Failed children
        don't kill the batch — shown as partial failure with retry-failed
        button" (feature-spec.md:106).
      parameters: [{ $ref: "#/components/parameters/taskId" }]
      responses:
        "202":
          description: Failed children re-enqueued; parent task returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------------- eval
  /eval/rubrics:
    get:
      tags: [judging]
      operationId: listRubrics
      x-requires: none
      summary: Rubrics (for the Variant judge section)
      description: |
        feature-spec.md:128 "GET/POST /eval/rubrics". Rubric EDITOR UI is
        Phase 2 (eval workbench); the POST exists so the
        generator can seed "judgments across 2 rubrics" (feature-spec.md:164)
        through the public API (feature-spec.md:181). Consumed by
        Evaluations · Configure (feature-spec.md:226). Paged: rubrics are
        user-created and never deleted. A caller filling a rubric PICKER
        should ask for a full page and compare `total` — a picker that
        silently omits a rubric is worse than one that says it is showing the
        first N.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Page of rubrics, latest version of each, in creation order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RubricPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [judging]
      operationId: createRubric
      x-requires: none
      summary: Create a rubric (append-only; new name = v1)
      description: |
        feature-spec.md:128 "GET/POST /eval/rubrics" — versioned, "save = new
        version". Posting an existing rubric's name appends the next version;
        no update/delete exists (append-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RubricCreate" }
      responses:
        "201":
          description: The created rubric version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rubric" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/rubrics/{rubricId}/versions:
    post:
      tags: [judging]
      operationId: createRubricVersion
      x-requires: none
      summary: Append the next rubric version (append-only)
      description: |
        feature-spec.md:128: "POST /eval/rubrics/{id}/versions (save = new
        version)" — each save mints a version and answers 201, which is why
        it is a POST and not a PUT on the rubric.
        Workbench rubric editor: "prompt text, save = new version, test
        against one case" (feature-spec.md:63). Appends the next version of
        this rubric id — never overwrites (invariant);
        Judgment.scorer.version keeps old scores comparable
        (feature-spec.md:59). Complements Phase-1 POST /eval/rubrics
        (existing NAME appends) with the id-addressed save the editor needs.
      parameters: [{ $ref: "#/components/parameters/rubricId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RubricUpdate" }
      responses:
        "201":
          description: The new rubric version (now latest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rubric" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/cases:
    post:
      tags: [datasets]
      operationId: createEvalCase
      x-requires: none
      summary: Create an eval case (handcrafted or sourced from a turn)
      description: |
        feature-spec.md:126: "POST /eval/cases (handcrafted or source: {tree,
        conversation_id, turn_id})". Model (feature-spec.md:54-57): input =
        "prompt + context (frozen)"; output = "candidate response";
        reference = expected answer, "handcrafted in an editor, or sourced
        from conversation history (pick a turn → its response becomes the
        reference)", nullable ("reference-free rubrics allowed"). Exactly
        one creation mode (request oneOf): handcrafted = input + output
        supplied; sourced = source supplied and the server derives input
        (the turn's prompt + envelope) and output (its response). Entry
        points: the workbench case editor and "add as eval case" on any turn
        (feature-spec.md:63).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalCaseCreate" }
      responses:
        "201":
          description: The created case (version 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/cases/import:
    post:
      tags: [datasets]
      operationId: importEvalCases
      x-requires: none
      summary: Bulk import cases (CSV/XLSX, column mapping, per-row errors)
      description: |
        feature-spec.md:125: "Import: POST /eval/cases/import
        (CSV/XLSX/pasted table, column mapping, per-row error report)".
        Workbench rule (feature-spec.md:63): "upload CSV/XLSX (or paste a
        table) with columns mapped to input/output/reference → creates/
        extends a benchmark in one shot (…queued for large files; row errors
        reported per line, not all-or-nothing)". Multipart: file (pasted
        tables are uploaded as CSV) + agenttree (every imported case is
        stamped with this — EvalCase.agenttree is required) + mapping (JSON
        object as a string: which column feeds input/output/reference) +
        benchmark_id (extend an existing benchmark — new membership version)
        or benchmark_name (create one). Small files: 200 with the per-row
        report inline. Above the server's size threshold: 202 TaskRef — an
        "import" task whose result.import_report carries the identical
        report shape on completion. Failed rows never abort the import;
        valid rows land.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mapping, agenttree]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX; a pasted table is submitted as CSV.
                agenttree:
                  type: string
                  description: >-
                    Free-form label applied to every case created by this
                    import (EvalCase.agenttree is required per-case; a
                    single import batch targets one agent tree/endpoint).
                mapping:
                  type: string
                  description: >-
                    JSON object string, e.g.
                    {"input":"question","output":"answer","reference":"expected"}
                    — reference optional (nullable references allowed,
                    feature-spec.md:57).
                benchmark_id:
                  type: string
                  description: Extend this benchmark (appends a new membership version).
                benchmark_name:
                  type: string
                  description: Create a new benchmark holding the imported cases.
      responses:
        "200":
          description: Import processed synchronously — per-row report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCaseImportReport" }
        "202":
          description: Large file — import queued; the finished task's result.import_report holds the report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/cases/{caseId}:
    get:
      tags: [datasets]
      operationId: getEvalCase
      x-requires: none
      summary: One eval case (judgment drawer)
      description: |
        feature-spec.md:126 "GET /eval/cases/{id}". Model (feature-spec.md:54):
        "EvalCase = {input, output, reference?}". Cases arrive handcrafted
        or imported via the workbench (feature-spec.md:63), or auto-created
        from conversation turns during judging (feature-spec.md:61). Returns
        the LATEST version. Consumed by the judgment drawer
        (feature-spec.md:229).
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The case (latest version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCase" }
        "404": { $ref: "#/components/responses/NotFound" }

  /eval/cases/{caseId}/versions:
    post:
      tags: [datasets]
      operationId: createEvalCaseVersion
      x-requires: none
      summary: Append the next eval-case version (append-only)
      description: |
        feature-spec.md:126: "POST /eval/cases/{id}/versions (new version)" —
        the same append-only versioning as rubrics (feature-spec.md:128) and
        instructions (feature-spec.md:33): each save appends the next version
        and never overwrites, which is why the write is a POST here and not a
        PUT on the case.
        Prior versions stay readable and existing judgments keep pointing at
        the content they actually judged. Rollback = post the old content
        again (a new version).
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalCaseUpdate" }
      responses:
        "201":
          description: The new case version (now latest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalCase" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # THE MERGED NOUN (v0.4.0). Casebook and EvalBenchmark were the same concept
  # modelled twice — "a named collection of turn REFERENCES" and "a named
  # collection of cases (versioned, reusable across runs/models)". They are one
  # resource now, EvalBenchmark, and the only real difference between them is a FIELD
  # on the member: an item is either a REFERENCE to a live turn or a FROZEN
  # case (EvalBenchmarkItem.kind). /casebooks and POST /casebooks/{id}/to-eval-set are
  # gone: materializing is no longer a conversion between two nouns, it is
  # POST /eval/benchmarks/{id}/freeze flipping items from reference to frozen.
  #
  # Membership is VERSIONED for every item, reference or frozen (the eval-benchmark
  # rule wins over the casebook's free mutation, because judgments reference
  # benchmarks and membership has to be reproducible): every add, removal and freeze
  # appends a new version carrying its FULL item list.
  /eval/benchmarks:
    get:
      tags: [datasets]
      operationId: listEvalBenchmarks
      x-requires: none
      summary: Eval benchmarks (latest version each)
      description: |
        feature-spec.md:127: "Benchmarks: POST/GET /eval/benchmarks". Model
        (feature-spec.md:58): "EvalBenchmark: named collection of cases
        (versioned, reusable across runs/models)", widened by the merge to
        hold live turn references as well as frozen cases. Returns the
        latest version of each benchmark, membership included — feeds the
        workbench benchmark manager (feature-spec.md:63), the ⊞ collect action
        and the judge's benchmark picker. Global, not
        tree-scoped: a benchmark may reference turns across trees, and per-item
        visibility still follows the viewer's tree permissions.

        Paged, and this is the collection paging helps most: every row
        carries its FULL item list, so an unpaged listing grew as the product
        of benchmark count and benchmark size.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Page of benchmarks, newest first, latest version of each, items included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmarkPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    post:
      tags: [datasets]
      operationId: createEvalBenchmark
      x-requires: none
      summary: Create an eval benchmark (version 1)
      description: |
        feature-spec.md:127 "POST/GET /eval/benchmarks"; workbench benchmark manager:
        "create/name/version benchmarks, drag cases in" (feature-spec.md:63).
        Starts empty unless items are supplied. Membership changes after
        creation go through POST /eval/benchmarks/{id}/versions, POST …/items or
        POST …/freeze — each appends a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkCreate" }
      responses:
        "201":
          description: The created benchmark (version 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/benchmarks/{benchmarkId}:
    get:
      tags: [datasets]
      operationId: getEvalBenchmark
      x-requires: none
      summary: One eval benchmark (latest membership version)
      description: |
        The benchmark with its items. Reference items are turn REFERENCES, never
        copies (feature-spec.md:285 "Quote the reference-not-copy rule") —
        render their transcripts by following each item's
        source.tree/conversation_id/turn_id; the transcript stays in its
        conversation. Frozen items name an EvalCase instead, read via
        GET /eval/cases/{id}.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      responses:
        "200":
          description: The benchmark (latest version), items included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [datasets]
      operationId: updateEvalBenchmarkMetadata
      x-requires: none
      summary: Rename / re-describe a benchmark (NOT a new version)
      description: |
        Metadata only, and deliberately NOT versioned: a benchmark's name and
        description belong to the benchmark, its items belong to the version. A
        rename therefore does not append a membership version and does not
        change what any judgment was made against. Membership changes go
        through POST /eval/benchmarks/{id}/versions, POST …/items or POST …/freeze.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkMetadataUpdate" }
      responses:
        "200":
          description: The updated benchmark (membership version unchanged).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [datasets]
      operationId: deleteEvalBenchmark
      x-requires: none
      summary: Delete a benchmark (its items are references — nothing else is touched)
      description: |
        Removes the benchmark and every membership version. Reference items were
        references, so the referenced turns and conversations are untouched;
        frozen items named EvalCases, and those cases — plus the judgments
        recorded against them and any evaluation replayed from this benchmark —
        remain. Deleting a benchmark never deletes evidence.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /eval/benchmarks/{benchmarkId}/versions:
    post:
      tags: [datasets]
      operationId: createEvalBenchmarkVersion
      x-requires: none
      summary: Append the next membership version (append-only)
      description: |
        feature-spec.md:127: "POST /eval/benchmarks/{id}/versions (versioned
        membership)". Each save is a new version carrying its FULL item
        list; earlier versions
        remain queryable so judgments made against version N stay
        attributable to exactly that membership. Metadata is NOT here: a
        rename is PATCH /eval/benchmarks/{id} and appends nothing, because a benchmark's
        name belongs to the benchmark and its items belong to the version.

        ITEM IDENTITY ACROSS VERSIONS: the server carries an item's id
        forward when the new version still holds the same referent — the
        same case_id for a frozen item, the same source triple for a
        reference item — and mints an id for referents the previous version
        did not hold. So an id addresses "this member of this benchmark", not
        "this row of this version", which is what makes POST …/freeze able
        to name an item.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkUpdate" }
      responses:
        "201":
          description: The new benchmark version (now latest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/benchmarks/{benchmarkId}/items:
    post:
      tags: [datasets]
      operationId: addEvalBenchmarkItem
      x-requires: none
      summary: Add one item — a turn reference (the ⊞ action) or a case
      description: |
        This is how you "Collect noteworthy turns into Casebooks with one
        keystroke … using the ⊞ action" — the keystroke now collects into an
        eval benchmark. Exactly one of source / case_id (request oneOf): source =
        {tree, conversation_id, turn_id} adds a REFERENCE item (nothing about
        the turn's text is stored); case_id adds a FROZEN item naming an
        existing EvalCase.

        The convenience half of POST /eval/benchmarks/{id}/versions: ⊞ fires from
        anywhere a turn is shown (Chat, the Inspector, results cells) where
        the caller does not hold the benchmark's membership and so cannot post a
        full one. Removal has no such endpoint on purpose — you can only
        remove from a benchmark you are already looking at, and that caller has the
        full item list to post.

        Appends a NEW membership version. IDEMPOTENT: adding a referent the
        latest version already holds appends nothing and returns that
        version unchanged, so a caller detects "already there" by an
        unchanged version number.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkItemCreate" }
      responses:
        "201":
          description: The benchmark — a new membership version, or the unchanged latest when the item was already a member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/benchmarks/{benchmarkId}/freeze:
    post:
      tags: [datasets]
      operationId: freezeEvalBenchmarkItems
      x-requires: none
      summary: Freeze reference items into cases
      description: |
        What "turn a casebook into an eval benchmark" becomes
        once the two nouns are one: not a conversion into another resource,
        but flipping items in place from reference to frozen. For each named
        reference item the server reuses the existing eval case for that turn
        or creates one sourced from it (identical semantics to POST
        /eval/cases with source), then appends a new membership version in
        which those items carry kind: frozen and their case_id. The item
        keeps its id and its source, so its provenance survives the freeze.

        item_ids omitted = every reference item in the latest version.
        Already-frozen items are left alone. A benchmark with no reference item to
        freeze is a 422 rather than a silent empty version.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkFreezeRequest" }
      responses:
        "201":
          description: The new membership version, with the named items frozen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/benchmarks/{benchmarkId}/replay:
    post:
      tags: [datasets]
      operationId: replayEvalBenchmark
      x-requires: none
      summary: Replay the benchmark's referenced turns as a regression suite
      description: |
        The benchmark doubles as "a replay regression suite". Replays every
        REFERENCE item's turn under the given configs — same engine as
        POST /agenttrees/{tree}/replay (feature-spec.md:41), same context
        fields and frozen default. Frozen items are skipped: a frozen case
        is content, not a turn in a conversation, so there is nothing to
        re-fire (judge those with POST /eval/judge instead). A benchmark may
        reference several trees, so the response carries one evaluation per
        tree touched, all children of a single parent task; each grid is
        fetched tree-scoped as usual.
      parameters: [{ $ref: "#/components/parameters/benchmarkId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvalBenchmarkReplayRequest" }
      responses:
        "202":
          description: Replays enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBenchmarkReplayAccepted" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /eval/judge:
    post:
      tags: [judging]
      operationId: judge
      x-requires: none
      summary: Enqueue LLM judging
      description: |
        feature-spec.md:129: "POST /eval/judge ({benchmark_id | case_ids | evaluation_id,
        judge_model, rubric_id} → enqueued), judgments append-only". Exactly
        one selector (oneOf): evaluation_id ("Judge this evaluation"… auto-creating cases
        from conversation turns if none exist", feature-spec.md:61),
        explicit case_ids, or — since v0.3.0, with EvalBenchmarks — benchmark_id
        (latest membership version unless benchmark_version pins one). Judge
        prompt receives the case's envelope (feature-spec.md:81).

        Since the merge, a benchmark version holds reference items as well as
        frozen ones, and judging resolves each item to a case: a frozen item
        contributes its case_id; a reference item is resolved by reusing the
        existing case for that turn or creating one sourced from it, exactly
        as POST …/freeze does. The turn is immutable, so the resolution is
        deterministic and re-judging version N reaches the same cases — but
        note it does NOT alter membership: the item stays a reference until
        someone freezes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JudgeRequest" }
      responses:
        "202":
          description: Judging enqueued (parent task + child per case).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /eval/judgments:
    get:
      tags: [judging]
      operationId: listJudgments
      x-requires: none
      summary: Judgment history (append-only)
      description: |
        feature-spec.md:130: "GET /eval/judgments?subject_id=&evaluation_id=
        &scorer_ref= (history)". Model (feature-spec.md:59): "Judgment
        (persisted forever, never overwritten): {subject, scorer, evaluation_id?,
        score, reasoning, created_at}. Re-judging appends." Thumbs live here
        too, as scorer kind human (feature-spec.md:60, :119) — filter by
        subject or by conversation_id to re-render 👍/👎 and per-turn score
        chips (feature-spec.md:64) on reload. Paginated: the store is
        append-only and grows forever.

        Every filter is an equality match, AND-ed. subject_kind and subject_id
        may be used alone or together.
      parameters:
        - name: subject_kind
          in: query
          description: Judgment.subject.kind.
          schema: { type: string, enum: [case, turn] }
        - name: subject_id
          in: query
          description: Judgment.subject.id — an eval case id or a turn id.
          schema: { type: string }
        - name: evaluation_id
          in: query
          description: Judgment.evaluation_id — the batch scope, not the subject.
          schema: { type: string }
        - name: scorer_ref
          in: query
          description: Judgment.scorer.ref — the rubric id for an LLM judge.
          schema: { type: string }
        - name: conversation_id
          in: query
          description: >
            Scope filter, not a Judgment field: judgments produced against
            this conversation — its thumbed turns and the cells replayed from
            it. Serves the chat view, which re-renders every turn's 👍/👎 in
            one request.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Page of matching judgments, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JudgmentPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /eval/evaluations/{evaluationId}/summary:
    get:
      tags: [judging]
      operationId: getEvaluationScoreSummary
      x-requires: none
      summary: Aggregate scores for an evaluation
      description: |
        feature-spec.md:130: "GET /eval/evaluations/{evaluation_id}/summary (aggregates)".
        Feeds the grid's "summary header (mean, distribution sparkline)"
        (feature-spec.md:49), updating live as judging tasks finish
        (feature-spec.md:64).
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Aggregates per scorer identity (kind + ref + version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationScoreSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- settings
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      x-requires: none
      summary: User-scoped app settings
      description: |
        feature-spec.md:119 "GET/PUT /settings"; consumed by Settings ·
        global (feature-spec.md:241, dev prompt #6 "Settings page bound to
        GET/PUT /settings, validation, optimistic save with rollback").
        User-scoped and server-persisted. Deliberately small — chat
        defaults, the replay fallback envelope (feature-spec.md:78, :77
        "fallback envelope in GET/PUT /settings"), and read-only upload
        limits for the composer (feature-spec.md:273 "Enforce type/size
        limits from settings"). The backend TARGET is deliberately NOT here:
        "Target is device-local (not synced via /settings)"
        (feature-spec.md:157) — it lives in the one config artifact. The
        Phase-2 Settings UI owns this shape; widen it there, not
        speculatively here.
      responses:
        "200":
          description: The user's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      tags: [settings]
      operationId: putSettings
      x-requires: none
      summary: Replace settings
      description: |
        Full replacement of the writable fields; readOnly fields
        (upload_limits) are server-owned and ignored if sent. UI does
        "optimistic save with rollback" (feature-spec.md:275).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer JWT from POST /auth/token (feature-spec.md:18 "token attached
        by the single API client; 401 anywhere → back to login"). Applied
        globally via the top-level security block; only GET /healthz and
        POST /auth/token opt out (security: []). AUTH_MODE=off backends do
        not ENFORCE this scheme — requests without a token succeed as the
        dev user — but the contract declares the on-mode and clients never
        branch (invariant).

  parameters:
    tree:
      name: tree
      in: path
      required: true
      description: Agent tree id, e.g. agent1 (feature-spec.md:111).
      schema: { type: string }
    agentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    conversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    treeId:
      name: treeId
      in: path
      required: true
      description: Tree being administered — same ids as {tree} (feature-spec.md:117).
      schema: { type: string }
    benchmarkId:
      name: benchmarkId
      in: path
      required: true
      schema: { type: string }
    rubricId:
      name: rubricId
      in: path
      required: true
      schema: { type: string }

  headers:
    XRequestId:
      description: >
        The correlation id for this request — the same value as Error.request_id.
        Present on EVERY response, success or failure, so a client can log it
        beside a request that has not failed yet. Honoured from an inbound
        X-Request-Id when the caller sends a sane one, generated otherwise.
      schema: { type: string }

  responses:
    NotFound:
      description: Resource not found (or tree not permitted — unpermitted trees never render, feature-spec.md:32).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Request error.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: >
        The request was understood but its content is not usable (code
        invalid): unparseable JSON, a body that is not an object, a missing
        or wrong-typed required field, a mutually-exclusive pair supplied
        together, or a query parameter outside its declared type/range.
        `details[]` names the fields — that is the whole reason this status is
        declared rather than left implicit. Declared on every operation that
        takes a request body and on every operation with a non-string typed
        query parameter, because those are exactly the operations an
        implementation can answer this way; retrying the same request
        unchanged always fails again.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: >
        A rate limit was reached (code rate_limited) — declared on the five
        operations that can start LIVE model generation, which is the work
        worth limiting. The reference implementation limits per BYOK key over
        a sliding window and answers at the DOOR, before any turn is created
        or any task is enqueued, so a caller is never charged for work it did
        not get. Retry-After carries the seconds until the window frees; the
        request is retryable unchanged, which is what separates this from 422.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The uploaded file exceeds the backend's size limit (code too_large).
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        Missing, invalid or expired bearer token (code unauthorized).
        AUTH_MODE=on only — an off-mode backend does not enforce the scheme.
        Clients route any 401 back to the login screen
        (feature-spec.md:18); they never branch on the mode.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        Authenticated, but lacking the capability this operation declares in
        its x-requires (code forbidden). Two shapes, one code: a missing global
        ROLE — admin for /admin/* management, inspect for the Inspector
        ("requires the inspect role") — or a missing PER-TREE
        permission on a tree the caller can already see, which is every
        operation declaring x-requires tune or evaluate. The message names the
        permission and the tree ("You do not have permission to tune agent tree
        'agent1'."), so a refusal reads as a permission problem rather than an
        unexplained failure. Never answered for a missing view: that is 404, so
        an unpermitted tree stays indistinguishable from an absent one.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >
        The target is unavailable for new work, in one of two ways. code
        tree_disabled: the tree is disabled — "new chat/replay/judge against
        it return 409 tree_disabled" (feature-spec.md:20); existing
        conversations stay readable and re-enabling via
        PATCH /admin/agenttrees/{id} restores everything. code
        conversation_deleted: the named conversation is a TOMBSTONE — it still
        reads (GET, /turns) so that forks, eval-benchmark items and judgments
        pointing at it stay honest, but it takes no rename, no message, no
        replay and no fork. Neither is recoverable by retrying; both are
        deliberate states, not transient failures.
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      description: >
        The ONE error body, on every non-2xx response of every operation.
        `code` is the stable machine discriminator a client branches on
        (not_found, tree_disabled, conversation_deleted, invalid,
        rate_limited, …); `message` is human prose and may be reworded at
        any time, so nothing should parse it. `details` points at the
        offending part of the request; `request_id` is what a user quotes in
        a support ticket and an operator greps for. Deliberately NOT
        application/problem+json (RFC 9457) — see the "Errors" note in
        info.description for the reasoning.
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
        request_id:
          type: string
          description: >
            Correlation id for this request, echoed on the X-Request-Id
            response header of EVERY response (2xx included). Honoured from
            an inbound X-Request-Id header when the caller supplies a sane
            one, generated otherwise — so an id minted by a gateway or a
            client retry loop survives into the backend's logs instead of
            being replaced by a second, unrelated one.
          example: req_9f2c1ab47e
        details:
          type: array
          description: >
            Zero or more machine-readable specifics. Absent or empty means
            the code and message are the whole story — a 404 has nothing to
            point at. Present for input the caller can fix: a 422 names the
            fields it rejected. NOT a stack trace and not a nested error tree.
            When exactly one field is at fault the entry's `message` will
            usually repeat `message` verbatim, and that is fine: what the
            entry adds is the `field`, not a second wording of the same
            sentence.
          items: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorDetail:
      type: object
      required: [message]
      description: >
        One specific complaint about one piece of input. The shape follows
        the per-row import report this contract already had (feature-spec.md:63
        "row errors reported per line, not all-or-nothing") — which now uses
        THIS schema rather than a near-identical private copy, so a client
        renders "which bit of my input, and why" once. `field` and `row` are
        two coordinates on the same input and either may be absent: a bad
        JSON body has a field and no row, a spreadsheet cell has both, and a
        complaint about the request as a whole has neither.
      properties:
        field:
          type: string
          nullable: true
          description: >
            Dotted/bracketed path to the offending input, relative to the
            request body — "items[2].kind", "input.prompt" — or the name of a
            query parameter ("page_size"), or, for row-oriented input, the
            spreadsheet COLUMN name. Null when the complaint is not about one
            named field.
          example: items[2].kind
        row:
          type: integer
          nullable: true
          description: 1-based data-row number, for row-oriented input (spreadsheet import). Null otherwise.
        message: { type: string }

    # ---------------------------------------------------------- identity/meta
    Me:
      type: object
      required: [user, permissions]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
        roles:
          type: array
          description: >
            Global roles (additive in v0.3.0, not required — Phase-1
            backends omit it): admin gates the Settings → Members / Agent
            trees UI (feature-spec.md:19 "visible when /me grants admin");
            inspect gates the Inspector. Absent or
            empty = neither.
          items: { type: string, enum: [admin, inspect] }
        permissions:
          type: object
          description: >
            Per-tree permission flags (feature-spec.md:32 "Permissions per tree
            (view / tune / evaluate)"), keyed by tree id.
          additionalProperties:
            type: array
            items:
              type: string
              enum: [view, tune, evaluate]

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, description: Server version (feature-spec.md:155). }
        contract_version:
          type: string
          example: 0.3.0
          description: |
            The Cupel contract version this backend implements — info.version
            of the document it was built against, NOT the server's own
            `version` above. OPTIONAL and additive: a backend that omits it
            stays conformant, and a client that reads it must tolerate absence.
        capabilities:
          type: object
          description: |
            Which families this backend implements, so `cupel-ready`, the UI
            and the project generator can ASK instead of guessing. Keys are
            family names — the `name`s of this document's top-level `tags`,
            which are the contract's whole family vocabulary; a key that is not
            a declared tag is meaningless and a family that is absent from this
            map is unknown, not `none`.

            OPTIONAL and additive, like `storage`. A backend reports it
            honestly or not at all: `full` claims every operation in the family
            is implemented, so an incorrect `full` is worse than silence.
          additionalProperties: { $ref: "#/components/schemas/Capability" }
        seed:
          type: string
          nullable: true
          description: Loaded seed dataset — mock only (feature-spec.md:155).
        storage:
          type: object
          description: |
            How this backend persists its data, surfaced where a
            human already looks (the backend switcher's health check). OPTIONAL
            and purely additive: a backend that does not report it stays
            conformant, and no client may require it.
          required: [mode]
          properties:
            mode:
              type: string
              enum: [local, s3]
              description: |
                local = a plain file on the machine running the backend;
                s3 = the same SQLite file continuously replicated to an
                S3-compatible bucket (Litestream) and restored on boot.
            restored:
              type: boolean
              description: |
                s3 only — whether this boot restored the database from the
                replica. false on the first ever boot, or after a failed
                restore (which degrades to a fresh, re-seeded database).

    Capability:
      type: object
      required: [status]
      description: |
        One family's coverage in a backend, as reported by Health.capabilities.
      properties:
        status:
          type: string
          enum: [full, partial, none]
          description: |
            full = every operation the contract declares for this family is
            implemented; partial = some but not all — a client should expect
            404/501 within the family and a UI should degrade rather than hide;
            none = the family is not served at all, which is what lets a UI
            hide its surface outright instead of rendering dead controls.
        implemented:
          type: integer
          description: Operations of this family the backend serves. Optional — `status` is the contract; these two only make it auditable.
        operations:
          type: integer
          description: Operations the contract declares for this family, at the contract_version reported alongside.
        missing:
          type: array
          description: The unserved operations, "METHOD /path", when status is partial or none. Optional and unbounded — a diagnostic, not a promise.
          items: { type: string, example: "GET /settings" }

    Model:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: claude-sonnet-5 }
        name: { type: string }

    # ------------------------------------------------------------------ trees
    AgentTree:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string, example: agent1 }
        name: { type: string }
        enabled:
          type: boolean
          description: >
            Toggled via PATCH /admin/agenttrees/{id} (feature-spec.md:20).
            false is only ever seen by admins (non-admin listings omit
            disabled trees); render greyed with a "disabled" badge.

    AgentTreeCreate:
      type: object
      required: [name]
      properties:
        id:
          type: string
          nullable: true
          description: Optional stable id (e.g. agent1); server generates one if omitted.
        name: { type: string }

    Endpoint:
      type: object
      required: [id, name]
      description: >
        "endpoint = an agent deployment/backend target" (feature-spec.md:67).
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }

    # ----------------------------------------------------------------- agents
    Agent:
      type: object
      required: [id, name, parent_id, live_version, tools, enabled, format]
      description: Node data for the tree view (feature-spec.md:25, :28).
      properties:
        id: { type: string }
        name: { type: string }
        parent_id:
          type: string
          nullable: true
          description: null for the root agent.
        live_version:
          type: integer
          description: Live instruction version number.
        tools:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        format:
          type: string
          enum: [text, yaml]
          description: >
            Instruction format metadata (feature-spec.md:34). Phase 1 treats
            both as plain text; YAML schema validation is Phase 2.

    AgentCreate:
      type: object
      required: [name]
      description: Add an agent under a node (feature-spec.md:26); null parent_id = new root.
      properties:
        name: { type: string }
        parent_id: { type: string, nullable: true }
        tools:
          type: array
          items: { type: string }
        format:
          type: string
          enum: [text, yaml]
          default: text

    InstructionVersion:
      type: object
      required: [version, content, format, created_at]
      properties:
        version: { type: integer, example: 15 }
        content: { type: string }
        format: { type: string, enum: [text, yaml] }
        created_at: { type: string, format: date-time }
        promoted_from_snapshot_id:
          type: string
          nullable: true
          description: Set when this version was a promoted draft snapshot (feature-spec.md:86).

    InstructionHistory:
      type: object
      required: [agent_id, format, live_version, versions]
      properties:
        agent_id: { type: string }
        format: { type: string, enum: [text, yaml] }
        live_version: { type: integer }
        versions:
          type: array
          description: All versions, ascending — append-only (feature-spec.md:33).
          items: { $ref: "#/components/schemas/InstructionVersion" }

    InstructionSave:
      type: object
      required: [content]
      properties:
        content: { type: string }
        format: { type: string, enum: [text, yaml] }
        snapshot_id:
          type: string
          nullable: true
          description: >
            Promote this draft snapshot to the new version; evaluations
            referencing it
            relabel (feature-spec.md:86, :85).

    SnapshotCreate:
      type: object
      required: [content]
      properties:
        content: { type: string, description: "The draft text, frozen verbatim." }
        base_version:
          type: integer
          nullable: true
          description: Version the draft was edited from — feeds the "v15-draft (a3f2)" label.

    Snapshot:
      type: object
      required: [snapshot_id, agent_id, label, created_at]
      properties:
        snapshot_id: { type: string, example: a3f2 }
        agent_id: { type: string }
        label:
          type: string
          example: v15-draft (a3f2)
          description: Display label until promoted (feature-spec.md:86).
        created_at: { type: string, format: date-time }

    Selection:
      type: object
      required: [items]
      description: Conversation/turn selection remembered per agent (feature-spec.md:87).
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SelectionItem" }

    SelectionItem:
      type: object
      required: [conversation_id]
      properties:
        conversation_id: { type: string }
        turn_ids:
          type: array
          nullable: true
          description: Absent/null = whole conversation; present = just these turns (feature-spec.md:44).
          items: { type: string }

    # ---------------------------------------------------------- conversations
    ContextEnvelope:
      type: object
      required: [system_date, timezone, region, locale]
      description: >
        Captured at generation, never reconstructed (feature-spec.md:76):
        "{system_date, timezone, region, locale, user_profile_ref?}". Phase 1
        replays always run under this frozen envelope (feature-spec.md:77, :78).
      properties:
        system_date: { type: string, format: date, example: "2026-08-02" }
        timezone: { type: string, example: Europe/London }
        region: { type: string, example: GB }
        locale: { type: string, example: en-GB }
        user_profile_ref: { type: string, nullable: true }

    Attachment:
      type: object
      required: [id, filename, content_type, size]
      properties:
        id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }
        url: { type: string, nullable: true }

    Turn:
      type: object
      required: [id, role, author, content, created_at, envelope]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        author:
          type: string
          description: >
            Who produced the turn (ADK-aligned): "user" for interactive human
            turns, the responding agent's name for assistant turns, or a
            stable machine identity (e.g. "mail-scanner") for
            machine-originated inbound turns.
        content:
          type: string
          description: >
            Markdown (feature-spec.md:10), or a serialized structured payload
            when content_type is json.
        content_type:
          type: string
          enum: [text, json]
          default: text
          description: >
            json = content is a structured payload (e.g. parsed orders from a
            machine-originated conversation); UI renders it as a formatted
            object instead of markdown.
        created_at: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        envelope:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: >
            "Every turn captures an envelope at generation" (feature-spec.md:76;
            "every turn records its context"). The key is
            required; null is permitted ONLY on legacy/imported turns
            (feature-spec.md:78). The server stamps assistant turns at
            generation and inbound (user/machine) turns at receipt; on turn
            objects in conversation listings (feature-spec.md:81).

    Lineage:
      type: object
      required: [parent_conversation_id, fork_turn_id]
      description: >
        feature-spec.md:69: "Forks carry lineage metadata: parent conversation
        id, fork turn, endpoint + config used."
      properties:
        parent_conversation_id: { type: string }
        fork_turn_id: { type: string }
        endpoint_id: { type: string, nullable: true }
        config:
          allOf: [{ $ref: "#/components/schemas/Variant" }]
          nullable: true

    Conversation:
      type: object
      required: [id, tree_id, title, origin, created_at, last_activity_at, fork_count, turn_count, deleted]
      properties:
        id: { type: string }
        tree_id: { type: string }
        title: { type: string }
        origin:
          type: string
          enum: [interactive, machine]
          description: >
            interactive = a human in the Chat UI; machine = a headless client
            (generator drip, production pipelines) via the same public API.
            Machine conversations are ordinary conversations — feedback,
            replay, forks and judging all apply.
        channel:
          type: string
          nullable: true
          description: Free-form source label for machine conversations, e.g. email-orders.
        agent_id:
          type: string
          nullable: true
          description: Entry agent that handled this conversation — backs ?agent_id= filtering (feature-spec.md:26, :87).
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        lineage:
          allOf: [{ $ref: "#/components/schemas/Lineage" }]
          nullable: true
          description: Present iff this conversation is a fork.
        fork_count:
          type: integer
          default: 0
          description: Number of direct forks — drives the "N forks" chip (feature-spec.md:5).
        turn_count:
          type: integer
          default: 0
          description: >-
            Turns in the transcript. Sized like fork_count and for the same
            reason: a caller can label a row ("14 turns"), decide whether to
            fetch at all, and size its page — without a request per row. The
            turns themselves are at
            GET /agenttrees/{tree}/conversations/{id}/turns.
        deleted:
          type: boolean
          readOnly: true
          default: false
          description: >-
            True iff this conversation is a TOMBSTONE — DELETE was called on
            it. Required, and the only way a client can tell a deleted
            conversation from an absent one: a tombstone still reads (this
            operation and its /turns), because the row is kept precisely so
            that the things pointing INTO it stay honest — a fork's lineage,
            an eval-benchmark reference item, an eval case's source, a judgment's
            subject. What deletion changes is that it leaves the listings
            (GET /conversations never returns one) and accepts no further
            work (409 conversation_deleted on rename, chat, replay and fork).

            A BOOLEAN, not a deleted_at timestamp, and the reason is honesty:
            no store here has ever recorded WHEN a conversation was deleted,
            so a timestamp would be either invented for existing tombstones or
            null for them — and a nullable deleted_at whose null means both
            "live" and "deleted, time unknown" is worse than no field. If a
            retention or purge feature ever needs the time, that feature adds
            the column and the field together.

    # THE collection shape. Every `<Thing>Page` in this document is exactly
    # this object with a different `items` type — same four keys, all four
    # required, no variants. OpenAPI 3.0 has no generics, so the shape is
    # repeated per type rather than parameterised; what keeps the copies
    # honest is tests/openapi-contract.test.js, which asserts that every
    # schema named *Page has precisely {items, page, page_size, total} with
    # items an array, and that no operation returns a bare-array collection
    # outside the four documented enumerations. Rationale for offset over
    # cursors is in info.description.
    ConversationPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        page:
          type: integer
          description: 1-based index of the page returned.
        page_size:
          type: integer
          description: Items per page — the effective value, which may be smaller than requested.
        total:
          type: integer
          description: >-
            Matches ACROSS all pages, so a caller can say "showing N of
            total" rather than truncating in silence.

    # ------------------------------------------------------------------- chat
    TurnPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Turn" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    ChatRequest:
      type: object
      required: [message]
      properties:
        conversation_id:
          type: string
          nullable: true
          description: Omit to start a new conversation.
        message: { type: string }
        client_message_id:
          type: string
          nullable: true
          description: >
            Idempotency key. Retrying with the same key returns the original
            result instead of appending a duplicate turn — required practice
            for machine callers (react-migration.md §5: guard side-effecting
            endpoints with idempotency keys).
        origin:
          type: string
          enum: [interactive, machine]
          default: interactive
          description: Applied to the conversation when this call creates one.
        channel:
          type: string
          nullable: true
          description: Free-form source label recorded on machine conversations (e.g. email-orders).
        author:
          type: string
          nullable: true
          description: Defaults to "user"; machine callers set a stable identity (e.g. mail-scanner).
        attachments:
          type: array
          description: Attachment ids from POST /upload.
          items: { type: string }
        model: { type: string, nullable: true }
        temperature: { type: number, nullable: true }
        system_prompt:
          type: string
          nullable: true
          description: Session-scoped chat settings, sent per call (feature-spec.md:7, :274).
        memory:
          type: boolean
          nullable: true
          description: >
            feature-spec.md:114: "/chat accepts memory flag". true = include
            the tree's memory document (GET /agenttrees/{tree}/memory) in
            the agent's context for this call; false = exclude it;
            omitted/null = backend default. Additive in v0.3.0 — Phase-1
            requests are unchanged.
        stream:
          type: boolean
          default: true
          description: >
            true = SSE token stream (UI default); false = single JSON response.

    ChatResponse:
      type: object
      required: [task_id, conversation_id, turn]
      description: stream=false response — the completed assistant turn.
      properties:
        task_id: { type: string }
        conversation_id: { type: string }
        turn: { $ref: "#/components/schemas/Turn" }

    ChatTaskEvent:
      type: object
      required: [task_id, conversation_id, user_turn_id, assistant_turn_id]
      description: First SSE event; task_id enables stop = DELETE /tasks/{task_id} (feature-spec.md:119).
      properties:
        task_id: { type: string }
        conversation_id: { type: string }
        user_turn_id: { type: string }
        assistant_turn_id: { type: string }

    TokenEvent:
      type: object
      required: [delta]
      properties:
        delta: { type: string }

    ChatDoneEvent:
      type: object
      required: [turn, status]
      description: Terminal chat SSE event — always sent, even on stop-generation.
      properties:
        turn:
          allOf: [{ $ref: "#/components/schemas/Turn" }]
          description: On cancelled, carries the partial content generated so far (persisted).
        status:
          type: string
          enum: [completed, cancelled]

    FeedbackRequest:
      type: object
      required: [message_id, rating]
      properties:
        message_id: { type: string, description: "= Turn.id (spec wording per feature-spec.md:272)." }
        rating: { type: string, enum: [up, down] }
        comment:
          type: string
          nullable: true
          description: >
            Optional free-text note the rater adds alongside the thumb. Stored
            as the appended judgment's `reasoning` — the same field the LLM
            judge writes its explanation into (feature-spec.md:59) — so thumbs
            and their reasons stay in the one judgment store
            (feature-spec.md:60, :119).

            The comment is deliberately NOT a Turn: turns are the unit that
            gets replayed and re-judged ("take stored conversations or
            individual turns, re-execute them under a changed config",
            feature-spec.md:41) and Turn.role is user|assistant, so feedback
            in that stream would be re-executed on replay and imported into
            eval cases. As a judgment it renders beneath its assistant turn
            and survives reload via GET /eval/judgments?conversation_id=.

            Additive and optional — NOT in `required`, so existing clients
            stay valid and conformance (which compares `required` keys) is
            unaffected. The spec version therefore stays 0.3.0.
            Append-only holds: re-rating posts a NEW judgment, never an edit.

    # ------------------------------------------------------------ evaluations
    Variant:
      type: object
      description: >
        Variant — the Run Config drawer's fields (feature-spec.md:46-48): "Agent tree +
        instruction version · Model, temperature · Judge (optional…)".
        instruction_version XOR snapshot_id — a snapshot is an untested draft
        (feature-spec.md:86); neither = the live version. endpoint_ids only
        applies to turn re-fire (feature-spec.md:67).
      not:
        description: instruction_version and snapshot_id are mutually exclusive.
        required: [instruction_version, snapshot_id]
      properties:
        agent_id: { type: string, nullable: true }
        instruction_version: { type: integer, nullable: true }
        snapshot_id: { type: string, nullable: true }
        model: { type: string, nullable: true }
        temperature: { type: number, nullable: true }
        endpoint_ids:
          type: array
          nullable: true
          items: { type: string }
        judge:
          allOf: [{ $ref: "#/components/schemas/JudgeConfig" }]
          nullable: true

    JudgeConfig:
      type: object
      required: [judge_model, rubric_id]
      description: Judge section, collapsed by default (feature-spec.md:48).
      properties:
        judge_model: { type: string }
        rubric_id: { type: string }

    ReplayRequest:
      type: object
      required: [selection, configs]
      properties:
        selection:
          type: array
          minItems: 1
          description: >
            Conversations, optionally narrowed to individual turns
            (feature-spec.md:44 "expandable to pick individual turns").
          items: { $ref: "#/components/schemas/SelectionItem" }
        configs:
          type: array
          minItems: 1
          description: >
            One grid column per config (feature-spec.md:49 "baseline column +
            one column per run config").
          items: { $ref: "#/components/schemas/Variant" }
        baseline_evaluation_id:
          type: string
          nullable: true
          description: >
            Use this prior evaluation's outputs as the baseline column instead of the
            stored originals.
        context_policy:
          type: string
          enum: [frozen, current, custom]
          default: frozen
          description: >
            feature-spec.md:77: "frozen (default — replay under each turn's
            original envelope) · current (today's context, for time-drift
            testing) · custom (explicit values)". Widened from the Phase-1
            pin [frozen] (feature-spec.md:82); the DEFAULT stays frozen, so
            Phase-1 requests are valid and behave unchanged. The grid
            labels each column's policy; mixed-policy comparisons get a
            warning badge.
        context_override:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: >
            The explicit envelope for context_policy custom
            (feature-spec.md:77 "custom (explicit values)";
            feature-spec.md:81 "accepts {context_policy,
            context_override?, tools_mode}"). REQUIRED when policy is
            custom; 422 if custom without it or if sent under another
            policy.
        fallback_policy:
          type: string
          enum: [settings, error]
          default: settings
          description: >
            What to do when the resolved policy reads a turn's envelope and
            it is null (legacy/imported turns). settings = apply the
            settings-level fallback envelope (feature-spec.md:78: "a
            settings-level default envelope applied to turns that have
            none… Applied explicitly — the grid marks such cells env:
            fallback, never silently 'now'"; stored as
            Settings.fallback_envelope); error = fail that cell instead.
            Only meaningful under frozen — current/custom never read the
            stored envelope.
        tools_mode:
          type: string
          enum: [live, replay_recorded]
          default: live
          description: >
            feature-spec.md:79 "Tools mode": replay_recorded = "replay tool
            spans' recorded results from the original trace — true
            counterfactual: only instructions/model/endpoint vary"; a tool
            absent from the trace falls back per-call to live or mock,
            logged in the new trace. live = re-execute tools. The WIRE
            default stays live so Phase-1 requests behave unchanged; the
            Variant UI preselects replay_recorded under frozen
            (feature-spec.md:79 "Playback is the default under frozen") —
            a UI default, not a wire default.

    ReplayAccepted:
      type: object
      required: [task_id, evaluation_id]
      description: Every request returns task_id (feature-spec.md:102).
      properties:
        task_id: { type: string, description: Parent task; children per conversation/turn (feature-spec.md:103). }
        evaluation_id: { type: string, description: "Fetch via GET /agenttrees/{tree}/evaluations/{id} for the grid." }

    ReplayTurnRequest:
      type: object
      required: [conversation_id, turn_id, endpoints]
      properties:
        conversation_id: { type: string }
        turn_id: { type: string }
        endpoints:
          type: array
          minItems: 1
          description: feature-spec.md:71 "body includes endpoints[]".
          items: { type: string }
        config:
          allOf: [{ $ref: "#/components/schemas/Variant" }]
          nullable: true
        context_policy:
          type: string
          enum: [frozen, current, custom]
          default: frozen
          description: As on ReplayRequest — widened in v0.3.0, default stays frozen (feature-spec.md:77, :78).
        context_override:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: As on ReplayRequest — required when context_policy is custom.
        fallback_policy:
          type: string
          enum: [settings, error]
          default: settings
          description: As on ReplayRequest — settings applies Settings.fallback_envelope, cell marked env:fallback (feature-spec.md:78).
        tools_mode:
          type: string
          enum: [live, replay_recorded]
          default: live
          description: As on ReplayRequest (feature-spec.md:79) — wire default live; UI preselects replay_recorded under frozen.

    ReplayTurnAccepted:
      type: object
      required: [evaluation_id, results]
      description: feature-spec.md:71 "returns one task_id + new conversation_id per endpoint".
      properties:
        evaluation_id:
          type: string
          description: >
            The evaluation backing the fork-comparison pivot (feature-spec.md:73
            "column per endpoint") — fetch via GET …/evaluations/{evaluationId}.
        results:
          type: array
          items:
            type: object
            required: [endpoint_id, task_id, conversation_id]
            properties:
              endpoint_id: { type: string }
              task_id: { type: string }
              conversation_id: { type: string, description: The new fork (lineage attached). }

    EvaluationSummaryItem:
      type: object
      required: [id, tree_id, status, created_at, task_id]
      properties:
        id: { type: string }
        tree_id: { type: string }
        status:
          type: string
          readOnly: true
          enum: [queued, running, done, failed, cancelled]
          description: >
            DERIVED from the Task named by task_id — see Evaluation.status for
            the full rule. Never accepted on write.
        created_at: { type: string, format: date-time }
        task_id: { type: string }
        label: { type: string, nullable: true }

    EvaluationSummaryPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EvaluationSummaryItem" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    Evaluation:
      type: object
      required: [id, tree_id, status, created_at, task_id, columns, rows]
      description: >
        Comparison-grid data: "baseline column + one column per run config, row
        per turn" (feature-spec.md:49).
      properties:
        id: { type: string }
        tree_id: { type: string }
        status:
          type: string
          readOnly: true
          enum: [queued, running, done, failed, cancelled]
          description: >
            DERIVED from the Task named by task_id, never stored on the
            evaluation and never accepted on write: Task is the single writer
            of execution state, and an evaluation is a view of the task that
            produced it. Implementors resolve it in this order — (1) the task
            is not `done` → its status verbatim; (2) the task finished but a
            unit of THIS evaluation failed → `failed`, the partial-failure
            read, and the one place this field legitimately differs from
            Task.status, which stays `done` because the batch really did
            finish ("partial failure, not a dead batch") — the caller's next
            move is POST /tasks/{taskId}/retry-failed; (3) otherwise `done`;
            (4) the task is unknown, e.g. pruned task history, → the
            evaluation's own cells answer: every cell `done` → `done`,
            anything else → `failed`. Case 4 never reads `queued`/`running`
            (nothing executes for a task that does not exist) and never claims
            a success it cannot see. A cross-tree eval-benchmark replay shares ONE
            task across several evaluations, so (2) counts only the failed
            units belonging to this evaluation.
        created_at: { type: string, format: date-time }
        task_id: { type: string }
        columns:
          type: array
          description: Index 0 = baseline. Column labels relabel when a snapshot promotes (feature-spec.md:86).
          items:
            type: object
            required: [label, config]
            properties:
              label: { type: string, example: v15-draft (a3f2) }
              config: { $ref: "#/components/schemas/Variant" }
        rows:
          allOf: [{ $ref: "#/components/schemas/EvaluationRowPage" }]
          description: >-
            ONE PAGE of rows (?page/?page_size), not the whole grid. Stable
            under the live fill: an evaluation's row set is fixed when the
            evaluation is created and only its cells change, so page N holds
            the same rows before, during and after the run.

    EvaluationRow:
      type: object
      required: [source, cells]
      properties:
        source:
          type: object
          required: [conversation_id, turn_id]
          properties:
            conversation_id: { type: string }
            turn_id: { type: string }
        cells:
          type: array
          description: One per column, same order; fills incrementally (feature-spec.md:108).
          items: { $ref: "#/components/schemas/Result" }

    EvaluationRowPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EvaluationRow" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    Result:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, running, done, failed] }
        content: { type: string, nullable: true, description: The (re)generated assistant output. }
        conversation_id: { type: string, nullable: true, description: "Fork holding this result, when applicable." }
        turn_id: { type: string, nullable: true, description: Replayed turn id — trace entry point (feature-spec.md:141). }
        task_id: { type: string, nullable: true }
        case_id:
          type: string
          nullable: true
          description: >
            Set once judging auto-creates a case for this cell — the join key
            for "score column reads latest judgment per (case, rubric)" and
            the judgment drawer (feature-spec.md:62, :64, :229).
        latest_score:
          type: number
          nullable: true
          description: Denormalized latest judgment score for the grid's score column.
        envelope_source:
          type: string
          nullable: true
          enum: [original, current, override, fallback]
          description: >
            Which envelope this cell ran under (additive in v0.3.0):
            original = the turn's frozen envelope; current = policy current;
            override = policy custom's context_override; fallback = the
            settings fallback envelope was applied — "the grid marks such
            cells env: fallback, never silently 'now'"
            (feature-spec.md:78). null on Phase-1 rows (implicitly
            original).
        error: { type: string, nullable: true }

    # ------------------------------------------------------------------ trace
    Span:
      type: object
      required: [id, parent_id, type, name, start, end, status, payload_ref]
      description: >
        feature-spec.md:140: "Span = {id, parent_id, type: agent|llm|tool, name,
        start, end, tokens_in?, tokens_out?, cost?, model?, status, payload_ref}".
      properties:
        id: { type: string }
        parent_id: { type: string, nullable: true }
        type: { type: string, enum: [agent, llm, tool] }
        name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, nullable: true }
        tokens_in: { type: integer, nullable: true }
        tokens_out: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        model: { type: string, nullable: true }
        status: { type: string, enum: [ok, error, running] }
        error:
          type: string
          nullable: true
          description: Error message when status is error — "Errors mark the span red" (feature-spec.md:145).
        payload_ref: { type: string, description: "Id for GET /spans/{id}/payload." }

    Trace:
      type: object
      required: [turn_id, totals, spans]
      properties:
        turn_id: { type: string }
        envelope:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: Shown in the trace header (feature-spec.md:76).
        totals:
          type: object
          description: Turn totals — wall time, total tokens in/out, cost (feature-spec.md:143).
          required: [wall_time_ms, tokens_in, tokens_out, cost]
          properties:
            wall_time_ms: { type: integer }
            tokens_in: { type: integer }
            tokens_out: { type: integer }
            cost: { type: number }
        spans:
          type: array
          items: { $ref: "#/components/schemas/Span" }

    SpanPayload:
      type: object
      required: [span_id]
      description: LLM spans carry prompt/response; tool spans carry args/result (feature-spec.md:145).
      properties:
        span_id: { type: string }
        prompt: { type: string, nullable: true }
        response: { type: string, nullable: true }
        args: { nullable: true }
        result: { nullable: true }

    # ------------------------------------------------------------------ tasks
    Task:
      type: object
      required: [id, type, status, progress, created_at]
      description: >
        feature-spec.md:103: "Task model: {id, type, status, progress: {done,
        total, stage}, parent_id?, error?, created/started/finished_at}. Batch
        work = parent task + child task per unit."
      properties:
        id: { type: string }
        type:
          type: string
          enum: [chat, replay, replay_turn, judge, compact, import]
          example: replay
          description: >
            compact and import are additive in v0.3.0: compact = memory
            compaction (POST /agenttrees/{tree}/memory/compact, queued —
            feature-spec.md:114); import = a large POST /eval/cases/import
            processed in the background (feature-spec.md:63 "queued for
            large files").
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        progress: { $ref: "#/components/schemas/TaskProgress" }
        parent_id: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          description: >
            What the task produced, for queue-panel deep links — "View
            results" to the grid, "Open in Chat" to the fork
            (feature-spec.md:64; sketch 05).
          properties:
            evaluation_id: { type: string, nullable: true }
            conversation_id: { type: string, nullable: true }
            turn_id: { type: string, nullable: true }
            import_report:
              allOf: [{ $ref: "#/components/schemas/EvalCaseImportReport" }]
              nullable: true
              description: >
                For type import (additive in v0.3.0) — the same per-row
                report a small synchronous POST /eval/cases/import returns
                inline (feature-spec.md:63).
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        children:
          type: array
          nullable: true
          description: Populated on GET /tasks/{id} (feature-spec.md:131).
          items: { $ref: "#/components/schemas/Task" }

    TaskPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    TaskProgress:
      type: object
      required: [done, total]
      properties:
        done: { type: integer }
        total: { type: integer }
        stage:
          type: string
          nullable: true
          example: "Conversation 3/10 · turn 2/6"
          description: Stage label shown next to the bar (feature-spec.md:105).

    TaskRef:
      type: object
      required: [task_id]
      properties:
        task_id: { type: string }

    TaskProgressEvent:
      type: object
      required: [task_id, progress]
      properties:
        task_id: { type: string }
        progress: { $ref: "#/components/schemas/TaskProgress" }

    SpanEvent:
      type: object
      required: [turn_id, span]
      description: Live trace span on the tasks channel (feature-spec.md:146).
      properties:
        turn_id: { type: string }
        span: { $ref: "#/components/schemas/Span" }

    JudgmentEvent:
      type: object
      required: [judgment]
      description: >
        A judgment appended by a finished judging task — "scores stream into
        the grid live" (feature-spec.md:64). The join keys are on the judgment
        itself: subject (what was scored) and evaluation_id (which grid).
      properties:
        judgment: { $ref: "#/components/schemas/Judgment" }

    # ------------------------------------------------------------------- eval
    Rubric:
      type: object
      required: [id, name, version, prompt, created_at]
      description: Versioned; save = new version (feature-spec.md:128) — editor UI is Phase 2.
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        prompt: { type: string }
        created_at: { type: string, format: date-time }

    RubricPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rubric" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    RubricCreate:
      type: object
      required: [name, prompt]
      properties:
        name: { type: string, description: Existing name appends the next version. }
        prompt: { type: string }

    EvalCase:
      type: object
      required: [id, input, output, agenttree]
      description: >
        feature-spec.md:54-58: "EvalCase = {input, output, reference?}" —
        input "prompt + context (frozen)", reference nullable (reference-free
        rubrics allowed).
      properties:
        id: { type: string }
        agenttree:
          type: string
          description: >-
            Free-form label naming the agent tree/endpoint this case is
            meant to evaluate. Required on every case — for a sourced case
            it defaults to source.tree; for a handcrafted case the author
            picks it (not validated against GET /agenttrees, since a case
            may target an endpoint this backend does not itself run).
            Carried forward unchanged across POST …/versions.
        input:
          type: object
          required: [prompt]
          properties:
            prompt: { type: string }
            envelope:
              allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
              nullable: true
              description: The judge prompt receives the case's envelope (feature-spec.md:81).
        output: { type: string, description: Candidate response. }
        reference: { type: string, nullable: true }
        source:
          type: object
          nullable: true
          description: >-
            Set when auto-created from a conversation turn (feature-spec.md:126
            "source: {tree, conversation_id, turn_id}").
          properties:
            tree: { type: string }
            conversation_id: { type: string }
            turn_id: { type: string }
        version:
          type: integer
          description: >
            Additive in v0.3.0 (not required — Phase-1 backends omit it,
            read as 1): versions append on POST /eval/cases/{id}/versions
            (feature-spec.md:126 "PUT (new version)"); GET returns the
            latest.
        created_at: { type: string, format: date-time }

    JudgeRequest:
      type: object
      required: [judge_model, rubric_id]
      description: >
        Exactly one of evaluation_id / case_ids / benchmark_id (feature-spec.md:129
        "{benchmark_id | case_ids | evaluation_id, judge_model, rubric_id}") — enforced
        by the oneOf. evaluation_id = "Judge this evaluation", auto-creating cases from
        turns if none exist (feature-spec.md:61). benchmark_id (added in v0.3.0
        with EvalBenchmarks) judges the benchmark's latest membership version unless
        benchmark_version pins one.
      oneOf:
        - required: [evaluation_id]
        - required: [case_ids]
        - required: [benchmark_id]
      properties:
        evaluation_id: { type: string, nullable: true }
        case_ids:
          type: array
          nullable: true
          items: { type: string }
        benchmark_id:
          type: string
          nullable: true
          description: Judge every case in this eval benchmark (feature-spec.md:129).
        benchmark_version:
          type: integer
          nullable: true
          description: Pin a benchmark membership version; omit for latest (feature-spec.md:127 "versioned membership").
        judge_model: { type: string }
        rubric_id: { type: string }
        rubric_version:
          type: integer
          nullable: true
          description: Pin a specific rubric version; omit for latest. Judgment records what ran (feature-spec.md:59).

    JudgmentSubject:
      type: object
      required: [kind, id]
      description: >
        WHAT was judged, named by a discriminator instead of by whichever of
        several nullable id columns happened to be set. kind case = an eval
        case, the unit an LLM judge scores; kind turn = a live conversation
        turn, which is what a 👍/👎 annotates (feature-spec.md:60).

        Only the kinds something produces today are declared. A later kind —
        evaluation, for a pairwise preference between two evaluations — is an
        added enum value, not a reshape, and nothing here has to move for it.
        There is deliberately no `result` kind: a grid cell is addressed by
        its case (Result.case_id) plus Judgment.evaluation_id, and judging an
        eval benchmark resolves every reference item into a case too, so `case` is
        the one unit every judge path already converges on.
      properties:
        kind: { type: string, enum: [case, turn] }
        id: { type: string }

    Scorer:
      type: object
      required: [kind]
      description: >
        WHO or WHAT produced the score. kind llm = an LLM judge: ref is the
        rubric id, version the rubric version that ran, model the judge model
        (feature-spec.md:59 "judge_model, rubric_id+version"). kind human = a
        👍/👎 from a person (feature-spec.md:60, :119): ref, version and model
        are all null, because a thumb runs no rubric and no model — nothing is
        invented to stand in for one.

        Only the kinds something produces today are declared. A deterministic
        check (kind check, ref = the check's id, version its version) is the
        motivating future and needs no reshape of this object. Shared with
        EvaluationScoreSummary so a scorer has exactly one wire shape.
      properties:
        kind: { type: string, enum: [llm, human] }
        ref:
          type: string
          nullable: true
          description: What the scorer ran — the rubric id for kind llm; null for kind human.
        version:
          type: integer
          nullable: true
          description: Version of `ref` — the rubric version for kind llm; null for kind human.
        model:
          type: string
          nullable: true
          description: The judge model for kind llm; null for kind human.

    Judgment:
      type: object
      required: [id, subject, scorer, score, created_at]
      description: >
        Append-only, never overwritten (feature-spec.md:59; invariant).
        One row is one score, addressed by a subject
        (what was judged) and a scorer (what produced the score) — the
        discriminated pair that replaced four mutually exclusive nullable
        foreign keys plus a type enum.

        evaluation_id is deliberately NOT the subject: an LLM judgment of a
        grid cell judges the CASE, and the evaluation is only the batch the
        score was produced in. Keeping it as a separate SCOPE is what lets one
        case be scored inside two evaluations without either overwriting the
        other's cell — listJudgments' evaluation_id filter,
        getEvaluationScoreSummary and Result.latest_score all key on the pair.
      properties:
        id: { type: string }
        subject: { $ref: "#/components/schemas/JudgmentSubject" }
        scorer: { $ref: "#/components/schemas/Scorer" }
        evaluation_id:
          type: string
          nullable: true
          description: >
            The evaluation this score was produced inside, when it was one —
            a scope, not a subject. Null for a thumb, and for judging
            standalone eval cases or an eval benchmark.
        score:
          type: number
          description: For scorer kind human, 1 = 👍 and 0 = 👎.
        reasoning: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    JudgmentPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Judgment" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    EvaluationScoreSummary:
      type: object
      required: [evaluation_id, scorers]
      description: >
        Feeds "summary header (mean, distribution sparkline)"
        (feature-spec.md:49). One group per SCORER IDENTITY — kind + ref +
        version — so a rubric and a future deterministic check aggregate
        through the same field, and the header stops being rubric-only.
        The judge model is NOT part of the group key (two judge models against
        one rubric version stay one row, as they always have), so each group's
        scorer carries model: null.
      properties:
        evaluation_id: { type: string }
        scorers:
          type: array
          items:
            type: object
            required: [scorer, mean, count, distribution]
            properties:
              scorer: { $ref: "#/components/schemas/Scorer" }
              mean: { type: number }
              count: { type: integer }
              distribution:
                type: array
                description: Bucketed score counts for the sparkline.
                items: { type: integer }

    # ------------------------------------------------------------------- auth
    AuthTokenRequest:
      type: object
      required: [email, password]
      description: >
        Login credentials (feature-spec.md:18 "email + password"). Mock
        seeds admin@demo / restricted@demo (feature-spec.md:21). SSO
        redirect flows land on the same endpoint server-side.
      properties:
        email: { type: string, format: email, example: admin@demo }
        password: { type: string, format: password }

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, me]
      description: >
        Real-shaped JWT (feature-spec.md:21) plus the authenticated user so
        the login screen can hydrate immediately — the app still calls
        GET /me on every boot regardless (invariant:
        "/me is always called").
      properties:
        access_token:
          type: string
          description: >
            JWT, sent as "Authorization: Bearer <token>" by the single API
            client on every subsequent call (feature-spec.md:18).
        token_type: { type: string, enum: [bearer] }
        expires_in:
          type: integer
          nullable: true
          description: Seconds until expiry; null = non-expiring (mock convenience).
        me: { $ref: "#/components/schemas/Me" }

    # ------------------------------------------------------------------ admin
    AdminUser:
      type: object
      required: [id, name, email, roles]
      description: Row in Settings → Members (feature-spec.md:19 "user list").
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          description: Global roles; per-tree rights live in the permission matrix.
          items: { type: string, enum: [admin, inspect] }
        invited:
          type: boolean
          default: false
          description: True until an invited user first signs in (feature-spec.md:19 "invite by email").
        created_at: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    AdminUserUpsert:
      type: object
      required: [email]
      description: >
        Upsert keyed by email: a new email creates an invited user
        (feature-spec.md:19 "invite by email"); an existing email updates
        name/roles. Null name/roles = leave unchanged.
      properties:
        email: { type: string }
        name: { type: string, nullable: true }
        roles:
          type: array
          nullable: true
          items: { type: string, enum: [admin, inspect] }

    PermissionMatrix:
      type: object
      required: [user_id, permissions]
      description: >
        Per-tree matrix for one user (feature-spec.md:19 "per-tree
        permission matrix (view/tune/evaluate checkboxes)"), keyed by tree
        id — the same shape as Me.permissions so the admin UI and /me agree
        exactly. Trees absent from the map grant nothing.
      properties:
        user_id: { type: string }
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [view, tune, evaluate]

    PermissionMatrixUpdate:
      type: object
      required: [permissions]
      description: >
        Full replacement of the user's matrix (PUT semantics). Takes effect
        on the user's next request — their GET /me reflects it
        (feature-spec.md:213, e2e checklist 12).
      properties:
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [view, tune, evaluate]

    TreeToggleRequest:
      type: object
      required: [enabled]
      description: >
        feature-spec.md:20: "PATCH /admin/agenttrees/{id} ({enabled})" —
        the only mutable field; disabling never deletes anything.
      properties:
        enabled: { type: boolean }

    AdminConversationItem:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [user_id]
          description: >
            Inspector row = an ordinary conversation plus the cross-user
            dimension ("filter by user, tree, date, or
            score").
          properties:
            user_id: { type: string, description: Owning user. }
            user_email: { type: string, nullable: true }
            latest_score:
              type: number
              nullable: true
              description: Latest judgment score across the conversation's turns — backs the score filter/column.

    AdminConversationPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminConversationItem" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    # -------------------------------------------------------------- generator
    GeneratorRates:
      type: object
      description: >
        feature-spec.md:184: "Rates configurable (conversations/hr, runs/hr,
        fail %)" — drip-mode knobs, surfaced as rate sliders in Settings
        (feature-spec.md:185).
      properties:
        conversations_per_hour: { type: number, nullable: true }
        evaluations_per_hour: { type: number, nullable: true }
        fail_pct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Injected child-task failure rate — exercises retry-failed (feature-spec.md:165).

    GeneratorCommand:
      type: object
      required: [mode]
      description: >
        feature-spec.md:118: "POST /admin/generator ({mode: seed|drip|stop,
        seed?, rates?})".
      properties:
        mode: { type: string, enum: [seed, drip, stop] }
        seed:
          type: string
          nullable: true
          description: >
            For mode seed — deterministic dataset id ("Deterministic from
            --seed N (e2e depends on this)", feature-spec.md:183).
        rates:
          allOf: [{ $ref: "#/components/schemas/GeneratorRates" }]
          nullable: true
          description: For mode drip; omitted fields keep their current values.

    GeneratorStatus:
      type: object
      required: [mode, rates, counts]
      description: >
        feature-spec.md:185: "GET /admin/generator/status (counts produced,
        current rates)".
      properties:
        mode: { type: string, enum: [idle, seeding, drip] }
        seed:
          type: string
          nullable: true
          description: Seed of the loaded dataset (the mock also reports it on GET /healthz).
        rates: { $ref: "#/components/schemas/GeneratorRates" }
        counts:
          type: object
          description: >
            Produced since seed — all written through the public API
            (invariant), so they flowed through the
            normal queues and SSE streams.
          required: [conversations, evaluations, judgments]
          properties:
            conversations: { type: integer }
            evaluations: { type: integer }
            judgments: { type: integer }

    # --------------------------------------------------------- eval workbench
    EvalCaseCreate:
      type: object
      required: [agenttree]
      description: >
        Exactly one creation mode (oneOf; feature-spec.md:126 "handcrafted
        or source: {tree, conversation_id, turn_id}"): handcrafted = input +
        output typed in the editor; sourced = the server derives input (the
        turn's prompt + envelope) and output (its response) from the
        referenced turn. reference optional in both (feature-spec.md:57
        "Nullable (reference-free rubrics allowed)"); "pick a turn → its
        response becomes the reference" is the reference-from-turn picker
        filling the field client-side. agenttree is required regardless of
        mode (own top-level `required`, not inside either oneOf branch —
        both modes need it): for a sourced case the client sends the same
        value as source.tree; for a handcrafted case the author picks it.
      oneOf:
        - required: [input, output]
        - required: [source]
      properties:
        agenttree: { type: string }
        input:
          type: object
          nullable: true
          required: [prompt]
          properties:
            prompt: { type: string }
            envelope:
              allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
              nullable: true
        output: { type: string, nullable: true, description: Candidate response. }
        reference: { type: string, nullable: true }
        source:
          type: object
          nullable: true
          required: [tree, conversation_id, turn_id]
          properties:
            tree: { type: string }
            conversation_id: { type: string }
            turn_id: { type: string }

    EvalCaseUpdate:
      type: object
      required: [input, output]
      description: >
        Full content for the NEW version (append-only,
        feature-spec.md:126 "PUT (new version)") — prior versions and the
        judgments recorded against them are untouched.
      properties:
        input:
          type: object
          required: [prompt]
          properties:
            prompt: { type: string }
            envelope:
              allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
              nullable: true
        output: { type: string }
        reference: { type: string, nullable: true }

    EvalCaseImportReport:
      type: object
      required: [rows_total, rows_imported, created_case_ids, errors]
      description: >
        Per-row error report (feature-spec.md:125; :63 "row errors reported
        per line, not all-or-nothing") — valid rows import even when others
        fail.
      properties:
        benchmark_id:
          type: string
          nullable: true
          description: The set created/extended (new membership version), when requested.
        rows_total: { type: integer }
        rows_imported: { type: integer }
        created_case_ids:
          type: array
          items: { type: string }
        errors:
          type: array
          description: >
            The SAME ErrorDetail the Error body carries — this report used to
            declare a private near-copy ({row, column?, message}), and a
            client had to render "which bit of my input was rejected" twice.
            Here `row` is always set and `field` carries the spreadsheet
            COLUMN name when the complaint is about one.
          items: { $ref: "#/components/schemas/ErrorDetail" }

    EvalBenchmark:
      type: object
      required: [id, name, version, items, created_at]
      description: >
        feature-spec.md:58: "EvalBenchmark: named collection of cases (versioned,
        reusable across runs/models)", merged with the Casebook —
        "a named collection of turn REFERENCES" — into
        the one noun. A member is either kind, so the collection is both:
        the raw material you collect with ⊞ and the reusable suite you judge.
        Membership is versioned (feature-spec.md:127): every change appends a
        new version with its own full item list, so judgments made against
        version N stay attributable to exactly that membership. name and
        description are NOT versioned — they belong to the benchmark, not to a
        version (PATCH /eval/benchmarks/{id}).
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        version: { type: integer, description: This membership version; the latest unless one was pinned. }
        items:
          type: array
          items: { $ref: "#/components/schemas/EvalBenchmarkItem" }
        created_at:
          type: string
          format: date-time
          description: Creation time of THIS version.

    EvalBenchmarkPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EvalBenchmark" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    EvalBenchmarkItem:
      type: object
      required: [id, kind, added_at]
      description: >
        One member. kind is the whole difference the merge collapsed:
        `reference` is a REFERENCE to a live turn, never a copy (dev prompt
        12a, feature-spec.md:285 "Quote the reference-not-copy rule") — the
        transcript stays in its conversation and nothing about its text is
        stored here; `frozen` names an EvalCase, the {input, output,
        reference?} record of feature-spec.md:54-58, which carries its own
        append-only version (POST /eval/cases/{id}/versions). A frozen item holds the
        case id rather than a copy of the content for the same reason
        judgments do: Judgment.case_id has to keep naming something.

        source survives a freeze, so an item frozen from a turn still says
        where it came from; it is null only for a frozen item whose case was
        handcrafted or imported and never lived in a conversation.
      properties:
        id:
          type: string
          description: >-
            Stable across membership versions for as long as the item's
            referent stays in the benchmark (POST /eval/benchmarks/{id}/versions).
        kind: { type: string, enum: [reference, frozen] }
        source:
          type: object
          nullable: true
          description: >-
            The referenced turn (feature-spec.md:126 "source: {tree,
            conversation_id, turn_id}"). Non-null for kind reference.
          required: [tree, conversation_id, turn_id]
          properties:
            tree: { type: string }
            conversation_id: { type: string }
            turn_id: { type: string }
        case_id:
          type: string
          nullable: true
          description: The EvalCase this item froze to. Non-null for kind frozen.
        note: { type: string, nullable: true, description: Why this member is noteworthy. }
        added_at: { type: string, format: date-time }

    EvalBenchmarkItemCreate:
      type: object
      description: >
        Exactly one referent (oneOf): source adds a reference item, case_id
        adds a frozen one.
      oneOf:
        - required: [source]
        - required: [case_id]
      properties:
        source:
          type: object
          nullable: true
          required: [tree, conversation_id, turn_id]
          properties:
            tree: { type: string }
            conversation_id: { type: string }
            turn_id: { type: string }
        case_id: { type: string, nullable: true }
        note: { type: string, nullable: true }

    EvalBenchmarkCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        items:
          type: array
          description: Initial membership (version 1); empty/omitted = start empty.
          items: { $ref: "#/components/schemas/EvalBenchmarkItemCreate" }

    EvalBenchmarkUpdate:
      type: object
      required: [items]
      description: >
        The full membership for the NEW version (append-only,
        feature-spec.md:127) — items absent from this list leave the benchmark.
        Metadata is not carried here; PATCH renames without a version.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EvalBenchmarkItemCreate" }

    EvalBenchmarkMetadataUpdate:
      type: object
      description: Metadata only; every membership change goes elsewhere. Absent fields are left unchanged.
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }

    EvalBenchmarkFreezeRequest:
      type: object
      description: >
        Which reference items to freeze into cases; omit item_ids for all of
        them.
      properties:
        item_ids:
          type: array
          nullable: true
          items: { type: string }

    EvalBenchmarkReplayRequest:
      type: object
      required: [configs]
      description: >
        Same engine as ReplayRequest (feature-spec.md:41) applied to the
        benchmark's REFERENCE items; context fields carry ReplayRequest's enums and
        defaults (frozen / settings / live), so Phase-1-shaped requests
        behave identically.
      properties:
        configs:
          type: array
          minItems: 1
          description: One grid column per config, as on ReplayRequest (feature-spec.md:49).
          items: { $ref: "#/components/schemas/Variant" }
        context_policy:
          type: string
          enum: [frozen, current, custom]
          default: frozen
          description: As on ReplayRequest (feature-spec.md:77, :78).
        context_override:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: As on ReplayRequest — required when context_policy is custom.
        fallback_policy:
          type: string
          enum: [settings, error]
          default: settings
          description: As on ReplayRequest (feature-spec.md:78).
        tools_mode:
          type: string
          enum: [live, replay_recorded]
          default: live
          description: As on ReplayRequest (feature-spec.md:79).

    EvalBenchmarkReplayAccepted:
      type: object
      required: [task_id, evaluations]
      description: >
        One parent task; one evaluation per tree the benchmark's reference items
        touch (evaluations are tree-scoped, feature-spec.md:111 — a
        cross-tree benchmark therefore yields several). Fetch each grid via
        GET /agenttrees/{tree_id}/evaluations/{evaluation_id}.
      properties:
        task_id: { type: string }
        evaluations:
          type: array
          minItems: 1
          items:
            type: object
            required: [tree_id, evaluation_id]
            properties:
              tree_id: { type: string }
              evaluation_id: { type: string }

    RubricUpdate:
      type: object
      required: [prompt]
      description: >
        The prompt text for the NEW rubric version (feature-spec.md:63
        "rubric editor (prompt text, save = new version…)").
      properties:
        prompt: { type: string }

    # ----------------------------------------------------------------- memory
    Memory:
      type: object
      required: [tree_id, content]
      description: >
        One MUTABLE memory document per tree — the
        deliberate exception to the append-only stores: PUT overwrites,
        DELETE clears. content "" = nothing remembered (never 404 for an
        existing tree).
      properties:
        tree_id: { type: string }
        content: { type: string, description: Markdown document. }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: null when never written.

    MemoryUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }

    # --------------------------------------------------------------- settings
    Settings:
      type: object
      required: [chat_defaults, fallback_envelope, upload_limits]
      description: >
        User-scoped app settings (feature-spec.md:119). Deliberately small —
        the Phase-2 Settings UI owns this shape. The backend target is NOT
        here: device-local by design (feature-spec.md:157).
      properties:
        chat_defaults:
          type: object
          description: >
            Defaults for the chat settings submenu (feature-spec.md:7);
            each /chat call still sends its session-scoped values
            (feature-spec.md:274) — these only seed new sessions.
          properties:
            model: { type: string, nullable: true }
            temperature: { type: number, nullable: true }
            system_prompt: { type: string, nullable: true }
        fallback_envelope:
          allOf: [{ $ref: "#/components/schemas/ContextEnvelope" }]
          nullable: true
          description: >
            feature-spec.md:78: "a settings-level default envelope applied
            to turns that have none (legacy/imported). Applied explicitly —
            the grid marks such cells env: fallback, never silently 'now'."
            Consumed when a replay's fallback_policy is settings; null =
            unset (fallback_policy settings then errors the affected cell).
        upload_limits:
          type: object
          readOnly: true
          description: >
            Server-owned composer limits, surfaced read-only
            (feature-spec.md:273 "Enforce type/size limits from settings");
            ignored if sent on PUT.
          required: [max_size_bytes, accepted_types]
          properties:
            max_size_bytes: { type: integer }
            accepted_types:
              type: array
              items: { type: string }
              example: [image/png, image/jpeg, application/pdf, text/plain]
