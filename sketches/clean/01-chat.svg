<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 272" font-family="Helvetica,Arial,sans-serif"><rect width="380" height="272" fill="#F5F4EF" rx="10"/><rect x="8" y="8" width="36" height="304" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="26" y="30" font-size="11" fill="#888780" text-anchor="middle">≡</text><text x="26" y="54" font-size="11" fill="#185FA5" text-anchor="middle">💬</text><text x="26" y="78" font-size="11" fill="#888780" text-anchor="middle">⚙</text><text x="26" y="102" font-size="11" fill="#888780" text-anchor="middle">✓</text><text x="26" y="126" font-size="11" fill="#888780" text-anchor="middle">▤</text><text x="26" y="150" font-size="11" fill="#888780" text-anchor="middle">⌂</text><text x="52" y="20" font-size="11" fill="#2C2C2A" font-weight="bold" text-anchor="start">Chat · agent1 · refunds</text><text x="372" y="20" font-size="10" fill="#888780" text-anchor="end">⚙</text><rect x="150" y="30" width="222" height="18" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="158" y="42.5" font-size="9" fill="#185FA5" text-anchor="start">How do refunds work?</text><rect x="52" y="54" width="300" height="30" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="60" y="66" font-size="9" fill="#2C2C2A" text-anchor="start">Approved refunds land in 3–5 days. Track under Order</text><text x="60" y="77" font-size="9" fill="#2C2C2A" text-anchor="start">s → Refunds.</text><text x="300" y="80" font-size="7.5" fill="#888780" text-anchor="start">👍👎⧉⑂⌁</text><rect x="150" y="92" width="222" height="18" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="158" y="104.5" font-size="9" fill="#185FA5" text-anchor="start">Mine shows two charges</text><rect x="52" y="116" width="300" height="30" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="60" y="128" font-size="9" fill="#2C2C2A" text-anchor="start">One is a temporary auth hold — it drops off within 3</text><text x="60" y="139" font-size="9" fill="#2C2C2A" text-anchor="start"> days automatically.</text><text x="300" y="142" font-size="7.5" fill="#888780" text-anchor="start">👍👎⧉⑂⌁</text><rect x="150" y="154" width="222" height="18" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="158" y="166.5" font-size="9" fill="#185FA5" text-anchor="start">And if it doesn't?</text><rect x="52" y="178" width="300" height="30" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="60" y="190" font-size="9" fill="#2C2C2A" text-anchor="start">Reply here after day 3 and I'll escalate to billing </text><text x="60" y="201" font-size="9" fill="#2C2C2A" text-anchor="start">with your order id.</text><text x="300" y="204" font-size="7.5" fill="#888780" text-anchor="start">👍👎⧉⑂⌁</text><rect x="52" y="218" width="90" height="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="6"/><text x="58" y="228" font-size="8" fill="#888780" text-anchor="start">📎 spec.pdf ✕</text><rect x="52" y="236" width="320" height="24" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" rx="8"/><text x="62" y="252" font-size="12" fill="#888780" text-anchor="start">+</text><text x="76" y="251" font-size="9" fill="#888780" text-anchor="start">Message…</text><text x="362" y="252" font-size="11" fill="#185FA5" text-anchor="end">↑</text></svg>