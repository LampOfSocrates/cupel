<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 412" font-family="Helvetica,Arial,sans-serif"><rect width="380" height="412" fill="#F5F4EF" rx="12"/><rect x="10" y="10" width="44" height="380" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="32" y="40" font-size="14" fill="#888780" text-anchor="middle">≡</text><text x="32" y="72" font-size="14" fill="#185FA5" text-anchor="middle">💬</text><text x="32" y="104" font-size="14" fill="#888780" text-anchor="middle">⚙</text><text x="32" y="136" font-size="14" fill="#888780" text-anchor="middle">✓</text><text x="32" y="168" font-size="14" fill="#888780" text-anchor="middle">▤</text><rect x="38" y="116" width="14" height="16" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="45.0" y="127.5" font-size="9" fill="#185FA5" text-anchor="middle">3</text><text x="58" y="160" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET /tasks</text><text x="64" y="26" font-size="13" fill="#2C2C2A" font-weight="bold" text-anchor="start">Chat · agent1</text><text x="370" y="26" font-size="10" fill="#888780" text-anchor="end">model · temp ⚙</text><text x="370" y="38" font-size="6.5" fill="#0F6E56" text-anchor="end" font-family="Courier,monospace">GET/PUT /settings</text><rect x="180" y="50" width="190" height="28" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="10"/><text x="190" y="68" font-size="11" fill="#185FA5" text-anchor="start">How do refunds work?</text><rect x="64" y="86" width="290" height="84" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="74" y="100" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">data: SSE POST /agenttrees/agent1/chat</text><text x="74" y="118" font-size="11" fill="#2C2C2A" text-anchor="start">Refunds are processed within 5 days</text><text x="74" y="134" font-size="11" fill="#2C2C2A" text-anchor="start">once approved…</text><text x="74" y="158" font-size="11" fill="#888780" text-anchor="start">👍👎</text><text x="100" y="158" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST /feedback</text><text x="170" y="158" font-size="11" fill="#888780" text-anchor="start">⑂</text><text x="182" y="158" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST …/replay/turn</text><text x="278" y="158" font-size="11" fill="#888780" text-anchor="start">⌁</text><text x="290" y="158" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET …/turns/{id}/trace</text><rect x="64" y="310" width="120" height="20" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="72" y="324" font-size="10" fill="#888780" text-anchor="start">📎 spec.pdf ✕</text><text x="190" y="324" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST /upload</text><rect x="64" y="340" width="306" height="32" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" rx="10"/><text x="78" y="361" font-size="16" fill="#888780" text-anchor="start">+</text><text x="96" y="360" font-size="11" fill="#888780" text-anchor="start">Message…</text><text x="340" y="361" font-size="14" fill="#185FA5" text-anchor="end">↑</text><text x="336" y="384" font-size="6.5" fill="#993C1D" text-anchor="end" font-family="Courier,monospace">POST /agenttrees/agent1/chat (SSE back)</text><text x="10" y="402" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET = data in</text><text x="80" y="402" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST/PUT/DEL = action</text></svg>