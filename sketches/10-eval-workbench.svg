<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 292" font-family="Helvetica,Arial,sans-serif"><rect width="380" height="292" fill="#F5F4EF" rx="12"/><text x="10" y="22" font-size="13" fill="#2C2C2A" font-weight="bold" text-anchor="start">Eval workbench</text><rect x="130" y="10" width="44" height="16" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="152.0" y="21.5" font-size="9" fill="#185FA5" text-anchor="middle">Cases</text><rect x="180" y="10" width="38" height="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.75" rx="8"/><text x="199.0" y="21.5" font-size="9" fill="#5F5E5A" text-anchor="middle">Sets</text><rect x="224" y="10" width="52" height="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.75" rx="8"/><text x="250.0" y="21.5" font-size="9" fill="#5F5E5A" text-anchor="middle">Rubrics</text><rect x="10" y="36" width="132" height="232" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="20" y="54" font-size="10" fill="#2C2C2A" font-weight="bold" text-anchor="start">Set: refund-fails v3</text><text x="20" y="66" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET /eval/sets</text><text x="20" y="86" font-size="9" fill="#5F5E5A" text-anchor="start">▸ case 01  ref ✓</text><rect x="16" y="94" width="120" height="20" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="6"/><text x="24" y="107" font-size="9" fill="#185FA5" text-anchor="start">▾ case 02  ref —</text><text x="20" y="132" font-size="9" fill="#5F5E5A" text-anchor="start">▸ case 03  ref ✓</text><text x="20" y="152" font-size="9" fill="#5F5E5A" text-anchor="start">▸ case 04  ref ✓</text><line x1="16" y1="164" x2="136" y2="164" stroke="#E9E7DF" stroke-width="1"/><text x="20" y="182" font-size="9" fill="#185FA5" text-anchor="start">+ New case</text><text x="20" y="200" font-size="9" fill="#185FA5" text-anchor="start">⇪ Import CSV/XLSX</text><text x="20" y="212" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST /eval/cases/import</text><text x="20" y="232" font-size="9" fill="#5F5E5A" text-anchor="start">from Casebook ▾</text><text x="20" y="244" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST /casebooks/{id}/to-eval-set</text><rect x="150" y="36" width="220" height="232" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="160" y="54" font-size="10" fill="#2C2C2A" font-weight="bold" text-anchor="start">Case 02</text><text x="360" y="54" font-size="7.5" fill="#888780" text-anchor="end">env: 2026-06-11 · en-GB</text><text x="160" y="74" font-size="8" fill="#888780" text-anchor="start">INPUT</text><rect x="158" y="80" width="204" height="30" fill="#F5F4EF" stroke="#E9E7DF" stroke-width="0.75" rx="6"/><text x="166" y="98" font-size="9" fill="#2C2C2A" text-anchor="start">Why was I charged twice?</text><text x="160" y="126" font-size="8" fill="#888780" text-anchor="start">OUTPUT (candidate)</text><text x="360" y="126" font-size="8" fill="#185FA5" text-anchor="end">from turn ▾</text><rect x="158" y="132" width="204" height="30" fill="#F5F4EF" stroke="#E9E7DF" stroke-width="0.75" rx="6"/><text x="166" y="150" font-size="9" fill="#2C2C2A" text-anchor="start">Duplicate holds usually drop off…</text><text x="160" y="178" font-size="8" fill="#888780" text-anchor="start">REFERENCE (expected)</text><text x="360" y="178" font-size="8" fill="#185FA5" text-anchor="end">paste / from turn ▾</text><rect x="158" y="184" width="204" height="42" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.2" rx="6"/><text x="166" y="200" font-size="9" fill="#3B6D11" text-anchor="start">One charge is a temporary auth hold;</text><text x="166" y="213" font-size="9" fill="#3B6D11" text-anchor="start">it drops in 3 days. No double charge.</text><text x="160" y="240" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">PUT /eval/cases/{id}  (save = new version)</text><rect x="286" y="248" width="76" height="16" fill="#378ADD" stroke="#378ADD" stroke-width="0.75" rx="8"/><text x="324" y="259" font-size="8" fill="#FFFFFF" text-anchor="middle">Judge case ▸</text><text x="282" y="278" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST /eval/judge {case_ids:[02]}</text></svg>