<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 256" font-family="Helvetica,Arial,sans-serif"><rect width="380" height="256" fill="#F5F4EF" rx="12"/><text x="10" y="24" font-size="10" fill="#5F5E5A" text-anchor="start">agent1 ▸ Billing ▸</text><rect x="110" y="12" width="104" height="16" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="162.0" y="23.5" font-size="9" fill="#185FA5" text-anchor="middle">Refunds sub-agent</text><text x="230" y="24" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET /agenttrees (permitted)</text><rect x="10" y="38" width="96" height="144" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="20" y="56" font-size="9" fill="#888780" text-anchor="start">Versions</text><text x="18" y="68" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET …/instructions</text><rect x="18" y="76" width="80" height="16" fill="#E6F1FB" stroke="#E6F1FB" stroke-width="0.75" rx="8"/><text x="58.0" y="87.5" font-size="9" fill="#185FA5" text-anchor="middle">v15 · draft</text><text x="24" y="112" font-size="10" fill="#5F5E5A" text-anchor="start">v14 · live</text><text x="24" y="130" font-size="10" fill="#5F5E5A" text-anchor="start">v13</text><text x="24" y="152" font-size="9" fill="#888780" text-anchor="start">↩ rollback</text><text x="18" y="166" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST …/instructions/versions</text><rect x="114" y="38" width="256" height="144" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="10"/><text x="124" y="52" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">data: GET …/instructions?v=15</text><text x="124" y="70" font-size="10" fill="#2C2C2A" text-anchor="start">You are a refunds specialist.</text><rect x="122" y="80" width="240" height="18" fill="#FCEBEB" stroke="#FCEBEB" stroke-width="0.75" rx="4"/><text x="128" y="92" font-size="9" fill="#A32D2D" text-anchor="start">- Escalate all disputes over £100.</text><rect x="122" y="104" width="240" height="28" fill="#EAF3DE" stroke="#EAF3DE" stroke-width="0.75" rx="4"/><text x="128" y="116" font-size="9" fill="#3B6D11" text-anchor="start">+ Escalate disputes over £250;</text><text x="128" y="128" font-size="9" fill="#3B6D11" text-anchor="start">+ offer credit first.</text><text x="124" y="150" font-size="10" fill="#2C2C2A" text-anchor="start">Always cite the policy section…</text><text x="10" y="206" font-size="9" fill="#888780" text-anchor="start">Saving never overwrites — creates v16</text><rect x="196" y="192" width="84" height="24" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.75" rx="8"/><text x="238" y="208" font-size="9" fill="#5F5E5A" text-anchor="middle">Test in Runs</text><text x="238" y="228" font-size="6.5" fill="#993C1D" text-anchor="middle" font-family="Courier,monospace">POST …/refunds/snapshots</text><rect x="288" y="192" width="82" height="24" fill="#378ADD" stroke="#378ADD" stroke-width="0.75" rx="8"/><text x="329" y="208" font-size="9" fill="#FFFFFF" text-anchor="middle">Save as v16</text><text x="340" y="228" font-size="6.5" fill="#993C1D" text-anchor="end" font-family="Courier,monospace">POST …/instructions/versions</text><text x="10" y="246" font-size="6.5" fill="#0F6E56" text-anchor="start" font-family="Courier,monospace">GET = data in</text><text x="80" y="246" font-size="6.5" fill="#993C1D" text-anchor="start" font-family="Courier,monospace">POST/PUT/DEL = action</text></svg>