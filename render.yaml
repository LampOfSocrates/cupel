# P1-TDEPLOY Render blueprint (docs/deployment.md "How to deploy").
# ONE free-tier Docker web service, ONE origin: FastAPI serves the persona
# landing page at "/" and the whole demo (API + built Vite bundle) mounted at
# "/cupel-demo" (mock/root.py) — seed-if-empty on boot, no auth gate (Phase 1
# demo data is not sensitive; see docs/deployment.md).
#
# Named "cupel-site" so the hostname Render mints matches the public URL this
# is meant to have (cupel-site.onrender.com) — replaces BOTH the old
# Docker-only "cupel-demo" service (hostname drifted to skein.onrender.com)
# and the old standalone static-site "cupel-site" that served only
# docs/index.html. Deleting those two and applying this blueprint fresh is a
# manual Render-dashboard step; see docs/deployment.md.
#
# SINGLE WRITER — DO NOT SCALE (P2-PERSIST). With CUPEL_STORAGE=s3 this
# service is one SQLite database replicated by Litestream. Two instances
# writing the same replica CORRUPT it; they do not degrade gracefully. Never
# raise numInstances, and never run a second service against the same bucket.
services:
  - type: web
    name: cupel-site
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /cupel-demo/healthz
    envVars:
      # Seed the demo dataset deterministically, but ONLY when the database
      # comes up empty (mock/entrypoint.py should_seed) — with CUPEL_STORAGE=s3
      # a restored database must not be seeded on top of.
      - key: CUPEL_SEED_ON_BOOT
        value: "1"
      - key: CUPEL_SEED
        value: "42"
      # P2-PERSIST storage mode. "s3" = the same SQLite file, continuously
      # replicated to an R2 bucket by Litestream and restored from it on boot,
      # so the demo's data survives the free tier's ephemeral disk.
      #
      # This value lives here, not only in the dashboard, because a blueprint
      # apply rewrites the service's env from this file — pinning "local" here
      # would silently revert a dashboard flip and put the demo back to wiping
      # itself on every restart, with no error (degradation is deliberate).
      - key: CUPEL_STORAGE
        value: s3
      # The rest are SECRETS and must be set in the Render dashboard
      # (Environment tab) — they do not belong in a public repo, and sync:false
      # here would block blueprint applies. Without them mock/boot.py logs the
      # missing names and runs LOCAL and UNREPLICATED; /cupel-demo/healthz then
      # reports mode:"local", which is the signal that this happened.
      # Full walkthrough incl. R2 bucket creation: docs/deployment.md
      # "Storage modes".
      #   CUPEL_S3_BUCKET             cupel-demo
      #   CUPEL_S3_ENDPOINT           https://<account>.r2.cloudflarestorage.com
      #   CUPEL_S3_ACCESS_KEY_ID      <R2 API token access key id>
      #   CUPEL_S3_SECRET_ACCESS_KEY  <R2 API token secret>
      #   CUPEL_S3_PATH               sample-cupel-data
      #   CUPEL_S3_REGION             auto                (optional, default)
